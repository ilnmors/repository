---
# --- docs/archives/services.yaml ---
# Archived stacks in the current services schema. Not loaded by Ansible; see README.md.
services:
  containers:
    groupoffice:
      units:
        main:
          release: "groupoffice"
          hosts: ["app"]
          domain:
            public: "groupoffice"
            internal: "groupoffice.app"
          subuid: 100032
          ports:
            http:
              protocol: "tcp"
              int: 8005
              container: 80
          route:
            dav: true
          dependency:
            web:
              status: true
            db:
              status: true
              type: "mariadb"
    homebox:
      units:
        main:
          release: "homebox"
          hosts: ["app"]
          domain:
            public: "homebox"
            internal: "homebox.app"
          ports:
            http:
              protocol: "tcp"
              int: 7745
              container: 7745
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            oidc:
              status: true
              redirect_uris: ["/api/v1/users/login/oidc/callback"]
              scopes: ["openid", "groups", "email", "profile"]
              auth_method: "client_secret_basic"
              pkce: true
    llama:
      units:
        main:
          release: "llama"
          hosts: ["app"]
          ports:
            http:
              protocol: "tcp"
              int: 10002
              container: 9931
          dependency:
            models:
              default: "n-gpu-layers = all\nkv-unified = true\ncache-prompt = true\ncache-type-k = q8_0\ncache-type-v = q8_0\nflash-attn = auto\nreasoning = off\njinja = true\nlazy-mode = off\n"
              LFM2.5-24B-A2B-Heretic: "model = /models/LFM2.5-24B-A2B-Heretic/model.gguf\nc = 65536\nparallel = 2\nreasoning = on\nload-on-startup = true\n"
              LFM2.5-VL-3B-Heretic: "model = /models/LFM2.5-VL-3B-Heretic/model.gguf\nmmproj = /models/LFM2.5-VL-3B-Heretic/mmproj.gguf\nc = 32768\nparallel = 1\nload-on-startup = true\n"
              LFM2.5-Embedding-350M: "model = /models/LFM2.5-Embedding-350M/model.gguf\nembedding = true\npooling = cls\nc = 1024\nparallel = 1\nload-on-startup = true\n"
    nextcloud:
      units:
        main:
          release: "nextcloud"
          hosts: ["app"]
          domain:
            public: "nextcloud"
            internal: "nextcloud.app"
          subuid: 100032
          ports:
            http:
              protocol: "tcp"
              int: 8001
              container: 80
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            oidc:
              status: true
              redirect_uris: ["/apps/user_oidc/code"]
              scopes: ["openid", "profile", "email", "groups"]
              auth_method: "client_secret_post"
              pkce: true
        valkey:
          release: "valkey"
          hosts: ["app"]
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 6380
              container: 6379
    stablediffusion:
      units:
        main:
          release: "stablediffusion"
          hosts: ["app"]
          ports:
            http:
              protocol: "tcp"
              int: 10001
              container: 1234
          dependency:
            models:
              active: "zImage"
              zImage: "--diffusion-model /models/zImage/moodyRealMix_zitV7Global-Q8_0.gguf \\\n--llm /models/zImage/Qwen3-4B-Instruct-2507-Q4_K_M.gguf \\\n--vae /models/zImage/ae.safetensors \\\n--backend gpu \\\n--cfg-scale 1.0 \\\n--steps 9 \\\n--vae-tiling \\\n--vae-tile-size 32x32 \\\n--vae-tile-overlap 0.5\n"
