---
- name: Register the ezbookkeeping database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the ezbookkeeping authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "ezbookkeeping"

- name: Set the ezbookkeeping fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "EBK_AUTH_OAUTH2_CLIENT_SECRET"
        value: "{{ secrets['ezbookkeeping']['oidc']['secret'] }}"
      - name: "EBK_DATABASE_PASSWD"
        value: "{{ secrets['postgresql']['password']['ezbookkeeping'] }}"
  no_log: true

- name: Create the ezbookkeeping directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['ezbookkeeping']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/ezbookkeeping"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/ezbookkeeping/data"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/ezbookkeeping"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/ezbookkeeping/ssl"
  become: true

- name: Deploy the ezbookkeeping root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/ezbookkeeping/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ services['containers']['ezbookkeeping']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_ezbookkeeping"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_ezbookkeeping"
  no_log: true

- name: Deploy the ezbookkeeping image
  vars:
    containers_image_notifications: "notification_restart_ezbookkeeping"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the ezbookkeeping container file
  ansible.builtin.template:
    src: "ezbookkeeping/ezbookkeeping.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/ezbookkeeping.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_ezbookkeeping"

- name: Start the ezbookkeeping
  ansible.builtin.systemd_service:
    scope: "user"
    name: "ezbookkeeping.service"
    state: "started"
    daemon_reload: true
  register: "containers_ezbookkeeping_started"

- name: Apply the ezbookkeeping configuration handlers
  ansible.builtin.meta: "flush_handlers"
