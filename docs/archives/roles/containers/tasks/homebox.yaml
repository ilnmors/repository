---
- name: Register the homebox database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the homebox authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "homebox"

- name: Register the missing homebox api secret on secrets.yaml
  vars:
    secrets_target: '["homebox"]["api_secret"]'
    secrets_content: "{{ lookup('ansible.builtin.pipe', 'openssl rand -hex 32') | to_json }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "update"
  when: (secrets['homebox']['api_secret'] | default('', true) | length) == 0
  no_log: true

- name: Set the homebox fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "HBOX_AUTH_API_KEY_PEPPER"
        value: "{{ secrets['homebox']['api_secret'] }}"
      - name: "HBOX_DATABASE_PASSWORD"
        value: "{{ secrets['postgresql']['password']['homebox'] }}"
      - name: "HBOX_OIDC_CLIENT_SECRET"
        value: "{{ secrets['homebox']['oidc']['secret'] }}"
  no_log: true

- name: Create the homebox directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/homebox"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/homebox/data"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/homebox"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/homebox/ssl"
  become: true

- name: Deploy the homebox root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/homebox/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_homebox"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_homebox"
  no_log: true

- name: Deploy the homebox image
  vars:
    containers_image_notifications: "notification_restart_homebox"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the homebox container file
  ansible.builtin.template:
    src: "homebox/homebox.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/homebox.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_homebox"

- name: Start the homebox
  ansible.builtin.systemd_service:
    scope: "user"
    name: "homebox.service"
    state: "started"
    daemon_reload: true
  register: "containers_homebox_started"

- name: Apply the homebox configuration handlers
  ansible.builtin.meta: "flush_handlers"
