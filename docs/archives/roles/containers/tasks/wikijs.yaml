---
- name: Register the wikijs database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the wikijs authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "wikijs"

- name: Set the wikijs fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "WIKIJS_DB_PASS"
        value: "{{ secrets['postgresql']['password']['wikijs'] }}"
  no_log: true

- name: Create the wikijs directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['wikijs']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/wikijs"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/wikijs/data"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/wikijs/export"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/wikijs"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/wikijs/ssl"
  become: true

- name: Deploy the wikijs root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/wikijs/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ services['containers']['wikijs']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_wikijs"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_wikijs"
  no_log: true

- name: Deploy the wikijs image
  vars:
    containers_image_notifications: "notification_restart_wikijs"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the wikijs container file
  ansible.builtin.template:
    src: "wikijs/wikijs.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/wikijs.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_wikijs"

- name: Start the wikijs
  ansible.builtin.systemd_service:
    scope: "user"
    name: "wikijs.service"
    state: "started"
    daemon_reload: true
  register: "containers_wikijs_started"

- name: Apply the wikijs configuration handlers
  ansible.builtin.meta: "flush_handlers"
