---
- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "stablediffusion"

- name: Create the stablediffusion directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['home'] }}/containers/stablediffusion"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/stablediffusion/models"
  become: true

- name: Sync the stablediffusion models (--delete)
  ansible.posix.synchronize:
    src: "{{ nodes[target_host]['paths']['data'] }}/containers/stablediffusion/models/"
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/stablediffusion/models/"
    owner: true
    group: true
    perms: true
    delete: true
  delegate_to: "{{ inventory_hostname }}"
  become: true
  notify: "notification_restart_stablediffusion"

- name: Deploy the stablediffusion image
  vars:
    containers_image_notifications: "notification_restart_stablediffusion"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the stablediffusion container file
  ansible.builtin.template:
    src: "stablediffusion/stablediffusion.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/stablediffusion.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_stablediffusion"

- name: Start the stablediffusion
  ansible.builtin.systemd_service:
    scope: "user"
    name: "stablediffusion.service"
    state: "started"
    daemon_reload: true
  register: "containers_stablediffusion_started"

- name: Apply the stablediffusion configuration handlers
  ansible.builtin.meta: "flush_handlers"
