---
- name: Register the actual-budget authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "actual-budget"

- name: Set the actual-budget fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "ACTUAL_OPENID_CLIENT_SECRET"
        value: "{{ secrets['actual-budget']['oidc']['secret'] }}"
  no_log: true

- name: Create the actual-budget directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['actual-budget']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/actual-budget"
  become: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_actual-budget"
  no_log: true

- name: Deploy the actual-budget image
  vars:
    containers_image_notifications: "notification_restart_actual-budget"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the actual-budget container file
  ansible.builtin.template:
    src: "actual-budget/actual-budget.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/actual-budget.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_actual-budget"

- name: Start the actual-budget
  ansible.builtin.systemd_service:
    scope: "user"
    name: "actual-budget.service"
    state: "started"
    daemon_reload: true
  register: "containers_actual_budget_started"

- name: Apply the actual-budget configuration handlers
  ansible.builtin.meta: "flush_handlers"
