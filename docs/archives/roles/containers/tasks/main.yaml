---
- name: Include the actual-budget task
  ansible.builtin.include_tasks:
    file: "actual-budget.yaml"
    apply:
      tags: ["actual-budget"]
  when: target_host in services['containers']['actual-budget']['units']['main']['hosts']
  tags: ["actual-budget"]

