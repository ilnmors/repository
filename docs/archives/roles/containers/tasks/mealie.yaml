---
- name: Register the mealie database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the mealie authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "mealie"

- name: Set the mealie fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "MEALIE_POSTGRES_PASSWORD"
        value: "{{ secrets['postgresql']['password']['mealie'] }}"
      - name: "MEALIE_OIDC_CLIENT_SECRET"
        value: "{{ secrets['mealie']['oidc']['secret'] }}"
  no_log: true

- name: Create the mealie directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['mealie']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/mealie"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/mealie/data"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/mealie"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/mealie/ssl"
  become: true

- name: Deploy the mealie root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/mealie/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ services['containers']['mealie']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_mealie"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_mealie"
  no_log: true

- name: Deploy the mealie image
  vars:
    containers_image_notifications: "notification_restart_mealie"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the mealie container file
  ansible.builtin.template:
    src: "mealie/mealie.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/mealie.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_mealie"

- name: Start the mealie
  ansible.builtin.systemd_service:
    scope: "user"
    name: "mealie.service"
    state: "started"
    daemon_reload: true
  register: "containers_mealie_started"

- name: Apply the mealie configuration handlers
  ansible.builtin.meta: "flush_handlers"
