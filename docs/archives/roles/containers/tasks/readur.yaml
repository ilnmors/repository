---
- name: Register the readur database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the readur authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "readur"

- name: Register the missing readur jwt secret on secrets.yaml
  vars:
    secrets_target: '["readur"]["jwt_secret"]'
    secrets_content: "{{ lookup('ansible.builtin.pipe', 'openssl rand -hex 32') | to_json }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "update"
  when: (secrets['readur']['jwt_secret'] | default('', true) | length) == 0
  no_log: true

- name: Set the readur fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "READUR_JWT_SECRET"
        value: "{{ secrets['readur']['jwt_secret'] }}"
      - name: "READUR_DATABASE_URL"
        value: "postgresql://readur:{{ secrets['postgresql']['password']['readur'] | urlencode | replace('/', '%2F') }}@{{ services['containers']['postgresql']['units']['main']['domain']['internal'] }}.{{ site['domain']['internal'] }}/readur_db?sslmode=verify-full&sslrootcert=/etc/ssl/readur/{{ site['ca']['x509']['root']['certificate_file'] }}"
      - name: "READUR_OIDC_CLIENT_SECRET"
        value: "{{ secrets['readur']['oidc']['secret'] }}"
  no_log: true

- name: Create the readur directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/readur"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/readur/uploads"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/readur/watch"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/readur"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/readur/ssl"
  become: true

- name: Deploy the readur root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/readur/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_readur"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_readur"
  no_log: true

- name: Deploy the readur image
  vars:
    containers_image_notifications: "notification_restart_readur"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the readur container file
  ansible.builtin.template:
    src: "readur/readur.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/readur.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_readur"

- name: Start the readur
  ansible.builtin.systemd_service:
    scope: "user"
    name: "readur.service"
    state: "started"
    daemon_reload: true
  register: "containers_readur_started"

- name: Apply the readur configuration handlers
  ansible.builtin.meta: "flush_handlers"
