---
- name: Restart the actual-budget.service
  ansible.builtin.systemd_service:
    scope: "user"
    name: "actual-budget.service"
    state: "restarted"
    daemon_reload: true
  when: not (containers_actual_budget_started['changed'] | default(false))
  changed_when: false
  register: "result_restart_actual_budget"
  listen: "notification_restart_actual-budget"
  ignore_errors: true

