---
- name: Load the secrets
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Check the SOPS installation
      ansible.builtin.shell: |
        command -v sops
      args:
        executable: "/bin/bash"
      changed_when: false
      failed_when: false
      register: "is_sops_installed"

    - name: Fail when the SOPS binary is missing
      ansible.builtin.fail:
        msg: "sops is not installed. Please install sops manually before running this playbook"
      when: is_sops_installed['rc'] != 0

    - name: Decrypt the secret values
      environment:
        SOPS_AGE_KEY: "{{ secrets_age_key }}"
      ansible.builtin.shell: |
        /usr/bin/sops -d --output-type yaml "{{ role_path }}/files/secrets.yaml"
      args:
        executable: "/bin/bash"
      changed_when: false
      register: "decrypted_secrets"
      no_log: true

    - name: Load the decrypted secret values
      ansible.builtin.set_fact:
        secrets: "{{ decrypted_secrets['stdout'] | from_yaml }}"
      no_log: true
