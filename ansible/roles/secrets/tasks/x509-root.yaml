---
- name: Create the root CA
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Load the secrets
      ansible.builtin.include_role:
        name: "secrets"
        apply:
          tags: ["always"]

    - name: Fail if the root CA password does not exist
      ansible.builtin.assert:
        that:
          - (secrets['ca']['x509']['root']['password'] | default('', true) | length) > 0
        fail_msg: "The root CA password is required. Please read docs/console.md and follow the steps."
        success_msg: "The root CA password exists. Execution will continue."

    - name: Remove the previous temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true

    - name: Create the temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        state: "directory"
        mode: "0700"

    - name: Get the root CA password
      ansible.builtin.copy:
        content: |
          {{ secrets['ca']['x509']['root']['password'] }}
        dest: "/run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.password"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        mode: "0400"
      no_log: true

    - name: Create the root CA
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/step certificate create \
        "{{ site['domain']['internal'] }} Root CA" \
        /run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.crt \
        /run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.key \
        --password-file /run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.password \
        --profile root-ca \
        --not-after 87600h
        echo "Root CA created"
      args:
        executable: "/bin/bash"
      changed_when: "'Root CA created' in is_root_ca_created['stdout']"
      register: "is_root_ca_created"
      no_log: true

    - name: Read the root CA
      environment:
        ROOT_CA_PASSWORD: "{{ secrets['ca']['x509']['root']['password'] }}"
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/jq -n \
          --rawfile key "/run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.key" \
          --rawfile crt "/run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.crt" \
          '{key: $key, crt: $crt, password: env.ROOT_CA_PASSWORD}'
      args:
        executable: "/bin/bash"
      changed_when: false
      register: "secrets_root_ca_content"
      no_log: true

    - name: Update the root CA
      vars:
        secrets_target: '["ca"]["x509"]["root"]'
        secrets_content: "{{ secrets_root_ca_content['stdout'] }}"
      ansible.builtin.include_tasks:
        file: "update.yaml"
      no_log: true
  always:
    - name: Clean the temporary files
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true
