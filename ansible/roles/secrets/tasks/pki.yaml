---
- name: Manage the PKI
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Check the step-cli installation
      ansible.builtin.shell: |
        command -v step
      args:
        executable: "/bin/bash"
      changed_when: false
      failed_when: false
      register: "is_step_installed"
      tags: ["never", "root", "intermediate", "leaf"]

    - name: Fail when the step-cli binary is missing
      ansible.builtin.fail:
        msg: "step-cli is not installed. Please install step-cli manually before running this playbook"
      when: is_step_installed['rc'] != 0
      tags: ["never", "root", "intermediate", "leaf"]

    - name: Create the root CA
      ansible.builtin.include_tasks:
        file: "x509-root.yaml"
        apply:
          tags: ["never", "root"]
      tags: ["never", "root"]

    - name: Get the root CA and create the intermediate CA
      ansible.builtin.include_tasks:
        file: "x509-intermediate.yaml"
        apply:
          tags: ["never", "root", "intermediate"]
      tags: ["never", "root", "intermediate"]

    - name: Get the intermediate CA and create the leaf certificates
      vars:
        secrets_leaf_crt_services: >-
              {{ (
                  services['packages'] | default({})
                  | dict2items
                  | selectattr('value.units', 'defined')
                  | map(attribute='value.units')
                  | map('dict2items')
                  | flatten
                  | selectattr('value.dependency', 'defined')
                  | selectattr('value.dependency.pki', 'defined')
                  | selectattr('value.dependency.pki.cert', 'defined')
                  | selectattr('value.dependency.pki.cert', 'equalto', true)
                  | map(attribute='value')
                  | list
                ) + (
                  services['containers'] | default({})
                  | dict2items
                  | selectattr('value.units', 'defined')
                  | map(attribute='value.units')
                  | map('dict2items')
                  | flatten
                  | selectattr('value.dependency', 'defined')
                  | selectattr('value.dependency.pki', 'defined')
                  | selectattr('value.dependency.pki.cert', 'defined')
                  | selectattr('value.dependency.pki.cert', 'equalto', true)
                  | map(attribute='value')
                  | list
              ) }}
      ansible.builtin.include_tasks:
        file: "x509-leaf.yaml"
        apply:
          tags: ["never", "root", "intermediate", "leaf"]
      loop: "{{ secrets_leaf_crt_services }}"
      loop_control:
        loop_var: "target_service"
      tags: ["never", "root", "intermediate", "leaf"]

    - name: Create the SSH CA
      ansible.builtin.include_tasks:
        file: "ssh-root.yaml"
        apply:
          tags: ["never", "ssh"]
      tags: ["never", "ssh"]
