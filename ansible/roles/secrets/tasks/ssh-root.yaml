---
- name: Create the SSH CA
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Load the secrets
      ansible.builtin.include_role:
        name: "secrets"
        apply:
          tags: ["always"]

    - name: Remove the previous temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true

    - name: Create the temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        state: "directory"
        mode: "0700"

    - name: Create the SSH CA
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/ssh-keygen -t ed25519 -f /run/user/{{ nodes[control_host]['uid'] }}/ca/id_local_ssh_ca -C "{{ site['domain']['internal'] }} SSH CA" -N ""
        echo "SSH CA created"
      args:
        executable: "/bin/bash"
      changed_when: "'SSH CA created' in is_ssh_ca_created['stdout']"
      register: "is_ssh_ca_created"
      no_log: true

    - name: Read the SSH CA
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/jq -n \
          --rawfile key "/run/user/{{ nodes[control_host]['uid'] }}/ca/id_local_ssh_ca" \
          --rawfile pub "/run/user/{{ nodes[control_host]['uid'] }}/ca/id_local_ssh_ca.pub" \
          '{key: $key, pub: $pub}'
      args:
        executable: "/bin/bash"
      changed_when: false
      register: "secrets_ssh_ca_content"
      no_log: true

    - name: Update the SSH CA
      vars:
        secrets_target: '["ca"]["ssh"]["root"]'
        secrets_content: "{{ secrets_ssh_ca_content['stdout'] }}"
      ansible.builtin.include_tasks:
        file: "update.yaml"
      no_log: true
  always:
    - name: Clean the temporary files
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true
