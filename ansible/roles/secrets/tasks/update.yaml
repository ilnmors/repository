---
- name: Update the secrets
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Load the secrets
      ansible.builtin.include_role:
        name: "secrets"
        apply:
          tags: ["always"]

    - name: Update the secrets
      environment:
        SOPS_AGE_KEY: "{{ secrets_age_key }}"
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/sops set --value-stdin "{{ role_path }}/files/secrets.yaml" \
        '{{ secrets_target }}'
        echo "Secrets updated"
      args:
        executable: "/bin/bash"
        stdin: "{{ secrets_content }}"
      changed_when: "'Secrets updated' in is_secrets_updated['stdout']"
      register: "is_secrets_updated"
      no_log: true

    - name: Load the secrets
      ansible.builtin.include_role:
        name: "secrets"
        apply:
          tags: ["always"]
