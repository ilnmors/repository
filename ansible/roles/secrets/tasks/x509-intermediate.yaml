---
- name: Get the root CA and create the intermediate CA
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Load the secrets
      ansible.builtin.include_role:
        name: "secrets"
        apply:
          tags: ["always"]

    - name: Fail if the root CA does not exist
      ansible.builtin.assert:
        that:
          - (secrets['ca']['x509']['root']['key'] | default('', true) | length) > 0
          - (secrets['ca']['x509']['root']['crt'] | default('', true) | length) > 0
          - (secrets['ca']['x509']['root']['password'] | default('', true) | length) > 0
        fail_msg: "The root CA does not exist. Please use the 'root' tag first to create the root CA."
        success_msg: "The root CA exists. Execution will continue."

    - name: Fail if the intermediate CA password does not exist
      ansible.builtin.assert:
        that:
          - (secrets['ca']['x509']['intermediate']['password'] | default('', true) | length) > 0
        fail_msg: "The intermediate CA password is required. Please read docs/console.md and follow the steps."
        success_msg: "The intermediate CA password exists. Execution will continue."

    - name: Remove the previous temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true

    - name: Create the temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        state: "directory"
        mode: "0700"

    - name: Get the root key, cert and password
      ansible.builtin.copy:
        content: |
          {{ secrets['ca']['x509']['root'][item] }}
        dest: "/run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.{{ item }}"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        mode: "0400"
      loop:
        - "key"
        - "crt"
        - "password"
      no_log: true

    - name: Get the intermediate CA password
      ansible.builtin.copy:
        content: |
          {{ secrets['ca']['x509']['intermediate']['password'] }}
        dest: "/run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.password"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        mode: "0400"
      no_log: true

    - name: Create the intermediate CA
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/step certificate create \
        "{{ site['domain']['internal'] }} Intermediate CA" \
        /run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.crt \
        /run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.key \
        --password-file /run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.password \
        --profile intermediate-ca \
        --ca /run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.crt \
        --ca-key /run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.key \
        --ca-password-file /run/user/{{ nodes[control_host]['uid'] }}/ca/root_ca.password \
        --not-after 43800h
        echo "Intermediate CA created"
      args:
        executable: "/bin/bash"
      changed_when: "'Intermediate CA created' in is_intermediate_ca_created['stdout']"
      register: "is_intermediate_ca_created"
      no_log: true

    - name: Read the intermediate CA
      environment:
        INTERMEDIATE_CA_PASSWORD: "{{ secrets['ca']['x509']['intermediate']['password'] }}"
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/jq -n \
          --rawfile key "/run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.key" \
          --rawfile crt "/run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.crt" \
          '{key: $key, crt: $crt, password: env.INTERMEDIATE_CA_PASSWORD}'
      args:
        executable: "/bin/bash"
      changed_when: false
      register: "secrets_intermediate_ca_content"
      no_log: true

    - name: Update the intermediate CA
      vars:
        secrets_target: '["ca"]["x509"]["intermediate"]'
        secrets_content: "{{ secrets_intermediate_ca_content['stdout'] }}"
      ansible.builtin.include_tasks:
        file: "update.yaml"
      no_log: true
  always:
    - name: Clean the temporary files
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true
