---
- name: Get the intermediate CA and create the leaf certificates
  delegate_to: "{{ control_host }}"
  delegate_facts: true
  become: false
  block:
    - name: Load the secrets
      ansible.builtin.include_role:
        name: "secrets"
        apply:
          tags: ["always"]
    - name: Fail if the intermediate CA does not exist
      ansible.builtin.assert:
        that:
          - (secrets['ca']['x509']['intermediate']['key'] | default('', true) | length) > 0
          - (secrets['ca']['x509']['intermediate']['crt'] | default('', true) | length) > 0
          - (secrets['ca']['x509']['intermediate']['password'] | default('', true) | length) > 0
        fail_msg: "The intermediate CA does not exist. Please use the 'intermediate' tag first to create the intermediate CA."
        success_msg: "The intermediate CA exists. Execution will continue."
    - name: Remove the previous temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true
    - name: Create the temporary CA directory
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        state: "directory"
        mode: "0700"
    - name: Get the intermediate key, cert and password
      ansible.builtin.copy:
        content: |
          {{ secrets['ca']['x509']['intermediate'][item] }}
        dest: "/run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.{{ item }}"
        owner: "{{ nodes[control_host]['user'] }}"
        group: "{{ nodes[control_host]['group'] }}"
        mode: "0400"
      loop:
        - "key"
        - "crt"
        - "password"
      no_log: true
    - name: Create the leaf certificates
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/step certificate create \
        "{{ target_service['domain']['internal'] }}.{{ site['domain']['internal'] }}" \
        /run/user/{{ nodes[control_host]['uid'] }}/ca/{{ target_service['domain']['internal'] }}.crt \
        /run/user/{{ nodes[control_host]['uid'] }}/ca/{{ target_service['domain']['internal'] }}.key \
        --profile leaf \
        --san "{{ target_service['domain']['internal'] }}.{{ site['domain']['internal'] }}" \
        --ca /run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.crt \
        --ca-key /run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.key \
        --ca-password-file /run/user/{{ nodes[control_host]['uid'] }}/ca/intermediate_ca.password \
        --not-after 12900h \
        --insecure \
        --no-password
        echo "Leaf certificate created"
      args:
        executable: "/bin/bash"
      changed_when: "'Leaf certificate created' in is_leaf_certificate_created['stdout']"
      register: "is_leaf_certificate_created"
      no_log: true
    - name: Read the leaf certificates
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/jq -n \
          --rawfile key "/run/user/{{ nodes[control_host]['uid'] }}/ca/{{ target_service['domain']['internal'] }}.key" \
          --rawfile crt "/run/user/{{ nodes[control_host]['uid'] }}/ca/{{ target_service['domain']['internal'] }}.crt" \
          '{key: $key, crt: $crt}'
      args:
        executable: "/bin/bash"
      changed_when: false
      register: "secrets_leaf_ca_content"
      no_log: true
    - name: Update the leaf certificates
      vars:
        secrets_target: '["ca"]["x509"]["leaf"]["{{ target_service["domain"]["internal"] }}"]'
        secrets_content: "{{ secrets_leaf_ca_content['stdout'] }}"
      ansible.builtin.include_tasks:
        file: "update.yaml"
      no_log: true
  always:
    - name: Clean the temporary files
      ansible.builtin.file:
        path: "/run/user/{{ nodes[control_host]['uid'] }}/ca"
        state: "absent"
      no_log: true
