---
- name: Load the render-networkd task
  vars:
    target_host: "{{ target_vm }}" # noqa: var-naming[no-role-prefix]
  ansible.builtin.import_role:
    name: "nodes"
    tasks_from: "render-networkd"

- name: Create the temporary meta-data
  ansible.builtin.copy:
    content: |
      instance-id: vm-{{ target_vm }}
      local-hostname: {{ target_vm }}
      dsmode: local
    dest: "/run/user/{{ nodes[target_host]['uid'] }}/{{ target_vm }}-meta-data"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0600"
  register: "libvirt_vm_meta_data"
  no_log: true

- name: Create the temporary user-data
  ansible.builtin.template:
    src: "seeds/user-data.j2"
    dest: "/run/user/{{ nodes[target_host]['uid'] }}/{{ target_vm }}-user-data"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0600"
  register: "libvirt_vm_user_data"
  no_log: true

# The same static addresses as nodes/templates/networkd/common/20-lan.network. Without them the first
# boot has no configured link and systemd-networkd-wait-online waits out its 120 s timeout before
# write_files installs the networkd files. user-data removes this cloud-init copy before the reboot.
- name: Create the temporary network-config
  vars:
    libvirt_vm_segment: "{{ networks['segments']['server'] }}"
  ansible.builtin.copy:
    content: |
      version: 2
      ethernets:
        lan:
          match:
            macaddress: "{{ nodes[target_vm]['system']['nic']['lan']['mac'] }}"
          accept-ra: false
          addresses:
            - "{{ libvirt_vm_segment['hosts'][target_vm]['ipv4'] }}/{{ libvirt_vm_segment['subnet']['ipv4'] | split('/') | last }}"
            - "{{ libvirt_vm_segment['hosts'][target_vm]['ipv6'] }}/{{ libvirt_vm_segment['subnet']['ipv6'] | split('/') | last }}"
          routes:
            - to: "default"
              via: "{{ libvirt_vm_segment['gateway']['ipv4'] }}"
            - to: "default"
              via: "{{ libvirt_vm_segment['gateway']['ipv6'] }}"
          nameservers:
            addresses:
              - "{{ libvirt_vm_segment['hosts']['bind']['ipv4'] }}"
              - "{{ libvirt_vm_segment['hosts']['bind']['ipv6'] }}"
    dest: "/run/user/{{ nodes[target_host]['uid'] }}/{{ target_vm }}-network-config"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0600"
  register: "libvirt_vm_network_config"
  no_log: true

- name: Check the seed.iso
  ansible.builtin.stat:
    path: "{{ nodes[target_host]['paths']['libvirt'] }}/seeds/{{ target_vm }}-seed.iso"
  register: "libvirt_seediso"

- name: Create the temporary seed.iso
  ansible.builtin.shell: |
    set -euo pipefail
    cloud-localds -N /run/user/{{ nodes[target_host]['uid'] }}/{{ target_vm }}-network-config \
    {{ nodes[target_host]['paths']['libvirt'] }}/seeds/{{ target_vm }}-seed.iso \
    /run/user/{{ nodes[target_host]['uid'] }}/{{ target_vm }}-user-data \
    /run/user/{{ nodes[target_host]['uid'] }}/{{ target_vm }}-meta-data
    echo "Seed image created"
  args:
    executable: "/bin/bash"
  become: true
  when: libvirt_vm_meta_data['changed'] or libvirt_vm_user_data['changed'] or libvirt_vm_network_config['changed'] or not libvirt_seediso['stat']['exists']
  changed_when: "'Seed image created' in libvirt_seediso_created['stdout']"
  register: "libvirt_seediso_created"

- name: Set the seed.iso permission
  ansible.builtin.file:
    path: "{{ nodes[target_host]['paths']['libvirt'] }}/seeds/{{ target_vm }}-seed.iso"
    owner: "root"
    group: "libvirt-qemu"
    mode: "0640"
  become: true
