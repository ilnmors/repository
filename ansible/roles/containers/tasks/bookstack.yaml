---
- name: Register the bookstack database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_mariadb_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_mariadb_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "mariadb.yaml"
    apply:
      delegate_to: "{{ containers_mariadb_host }}"

- name: Register the bookstack rustfs client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_rustfs_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_rustfs_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "rustfs.yaml"
    apply:
      delegate_to: "{{ containers_rustfs_host }}"

- name: Register the bookstack authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "bookstack"

- name: Register the missing bookstack secret key on secrets.yaml
  vars:
    secrets_target: '["bookstack"]["secret_key"]'
    secrets_content: "{{ lookup('ansible.builtin.pipe', 'echo base64:$(openssl rand -base64 32)') | to_json }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "update"
  when: (secrets['bookstack']['secret_key'] | default('', true) | length) == 0
  no_log: true

- name: Set the bookstack fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "BOOKSTACK_SECRET_KEY"
        value: "{{ secrets['bookstack']['secret_key'] }}"
      - name: "BOOKSTACK_DB_PASSWORD"
        value: "{{ secrets['mariadb']['password']['bookstack'] }}"
      - name: "BOOKSTACK_OIDC_CLIENT_SECRET"
        value: "{{ secrets['bookstack']['oidc']['secret'] }}"
      - name: "BOOKSTACK_S3_SECRET_KEY"
        value: "{{ secrets['rustfs']['password']['bookstack'] }}"
  no_log: true

- name: Create the bookstack directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['bookstack']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['home'] }}/containers/bookstack"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/bookstack/ssl"
  become: true

- name: Deploy the bookstack root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/bookstack/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ services['containers']['bookstack']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_bookstack"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_bookstack"
  no_log: true

- name: Deploy the bookstack image
  vars:
    containers_image_notifications: "notification_restart_bookstack"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the container file
  ansible.builtin.template:
    src: "bookstack/bookstack.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/bookstack.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_bookstack"

- name: Start the bookstack
  ansible.builtin.systemd_service:
    scope: "user"
    name: "bookstack.service"
    state: "started"
    daemon_reload: true
  register: "containers_bookstack_started"

- name: Apply the bookstack configuration handlers
  ansible.builtin.meta: "flush_handlers"
