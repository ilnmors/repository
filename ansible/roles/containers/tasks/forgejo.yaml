---
- name: Register the forgejo database and account # noqa: var-naming[no-role-prefix]
  vars:
    containers_postgresql_client: "forgejo"
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql-register.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the forgejo authelia client # noqa: var-naming[no-role-prefix]
  vars:
    containers_authelia_client: "forgejo"
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia-register.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "forgejo"

- name: Set the forgejo fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "FORGEJO__database__PASSWD"
        value: "{{ secrets['postgresql']['password']['forgejo'] }}"
  no_log: true

- name: Create the forgejo directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['forgejo']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/forgejo"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/forgejo/data"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/forgejo"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/forgejo/ssl"
  become: true

- name: Deploy the forgejo root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/forgejo/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ services['containers']['forgejo']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_forgejo"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_forgejo"
  no_log: true

- name: Deploy the forgejo image
  vars:
    containers_image_notifications: "notification_restart_forgejo"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the container file
  ansible.builtin.template:
    src: "forgejo/forgejo.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/forgejo.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_forgejo"

- name: Start the forgejo
  ansible.builtin.systemd_service:
    scope: "user"
    name: "forgejo.service"
    state: "started"
    daemon_reload: true
  register: "containers_forgejo_started"

- name: Apply the forgejo configuration handlers
  ansible.builtin.meta: "flush_handlers"

# The OAuth2 login source lives in the forgejo database (no app.ini/env option):
# add it when missing, otherwise update it so the client secret and URL follow secrets.yaml.
- name: Wait for the forgejo CLI
  ansible.builtin.shell: |
    set -euo pipefail
    podman exec -u git forgejo forgejo admin auth list
  args:
    executable: "/bin/bash"
  register: "containers_forgejo_auth_list"
  retries: 30
  delay: 5
  until: containers_forgejo_auth_list['rc'] == 0
  changed_when: false

- name: Set the authelia login source id
  ansible.builtin.set_fact:
    containers_forgejo_authelia_source_id: >-
      {{
        containers_forgejo_auth_list['stdout_lines']
        | select('search', '^\d+\s+authelia\s')
        | map('regex_replace', '^(\d+)\s.*$', '\1')
        | first | default('')
      }}

- name: Add or update the authelia login source
  vars:
    containers_forgejo_authelia_url: "https://{{ services['containers']['authelia']['units']['main']['domain']['public'] }}.{{ site['domain']['public'] }}"
  environment:
    FORGEJO_OIDC_SECRET: "{{ secrets['authelia']['oidc']['clients']['forgejo']['secret'] }}"
  # The secret reaches the container as an environment variable and is expanded inside it (single quotes).
  ansible.builtin.shell: |
    set -euo pipefail
    podman exec -u git -e FORGEJO_OIDC_SECRET forgejo sh -c 'exec forgejo admin auth \
      {{ ('update-oauth --id ' ~ containers_forgejo_authelia_source_id) if (containers_forgejo_authelia_source_id | length) > 0 else 'add-oauth' }} \
      --name authelia \
      --provider openidConnect \
      --key forgejo \
      --secret "$FORGEJO_OIDC_SECRET" \
      --auto-discover-url "{{ containers_forgejo_authelia_url }}/.well-known/openid-configuration" \
      {% for scope in services['containers']['forgejo']['units']['main']['dependency']['oidc']['scopes'] %}--scopes {{ scope }} {% endfor %}'
  args:
    executable: "/bin/bash"
  # update-oauth runs every time and cannot report a diff; only a new source counts as a change.
  changed_when: (containers_forgejo_authelia_source_id | length) == 0
  no_log: true
