---
- name: Register the openwebui database and account # noqa: var-naming[no-role-prefix]
  vars:
    containers_postgresql_client: "openwebui"
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql-register.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the openwebui rustfs client # noqa: var-naming[no-role-prefix]
  vars:
    containers_rustfs_client: "openwebui"
    target_host: "{{ containers_rustfs_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_rustfs_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "rustfs-register.yaml"
    apply:
      delegate_to: "{{ containers_rustfs_host }}"

- name: Register the openwebui authelia client # noqa: var-naming[no-role-prefix]
  vars:
    containers_authelia_client: "openwebui"
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia-register.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "openwebui"

- name: Register the missing openwebui secret key on secrets.yaml
  vars:
    secrets_target: '["openwebui"]["secret_key"]'
    secrets_content: "{{ lookup('ansible.builtin.pipe', 'openssl rand -base64 32') | to_json }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "update"
  when: (secrets['openwebui']['secret_key'] | default('', true) | length) == 0
  no_log: true

- name: Set the openwebui fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "OPEN_WEBUI_SECRET_KEY"
        value: "{{ secrets['openwebui']['secret_key'] }}"
      - name: "OPEN_WEBUI_POSTGRES_PASSWORD"
        value: "{{ secrets['postgresql']['password']['openwebui'] }}"
      - name: "OPEN_WEBUI_OAUTH_CLIENT_SECRET"
        value: "{{ secrets['openwebui']['oidc']['secret'] }}"
      - name: "OPEN_WEBUI_S3_SECRET_KEY"
        value: "{{ secrets['rustfs']['password']['openwebui'] }}"
      - name: "OPEN_WEBUI_ADMIN_API_KEY"
        value: "{{ secrets['openwebui']['api']['console'] }}"
  no_log: true

- name: Create the openwebui directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/data"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/ssl"
  become: true

- name: Deploy the openwebui root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_openwebui"
  no_log: true

- name: Create the openwebui library directory
  ansible.builtin.file:
    path: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/library"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0755"
  become: true

- name: Deploy the openwebui library page and its sidebar link
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/openwebui/library/{{ item }}"
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/library/{{ item }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  loop:
    - "index.html"
    - "loader.js"
  become: true
  notify: "notification_restart_openwebui"

- name: Deploy the openwebui video connection script
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/openwebui/video-connection.py"
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/video-connection.py"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  become: true
  notify: "notification_restart_openwebui"

- name: Create the openwebui functions directory
  ansible.builtin.file:
    path: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/functions"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0755"
  become: true

- name: Remove retired openwebui filter files
  ansible.builtin.file:
    path: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/functions/flux2-lora-filter.py"
    state: "absent"
  become: true

- name: Deploy the openwebui managed filter and sync script
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/openwebui/{{ item.src }}"
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/openwebui/{{ item.dest }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  loop:
    - src: "qwen-image-filter.py"
      dest: "functions/qwen-image-filter.py"
    - src: "sync-functions.py"
      dest: "sync-functions.py"
  become: true
  notify: "notification_restart_openwebui"

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_openwebui"
  no_log: true

- name: Deploy the openwebui image
  vars:
    containers_image_notifications: "notification_restart_openwebui"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the container file
  ansible.builtin.template:
    src: "openwebui/openwebui.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/openwebui.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_openwebui"

- name: Start the openwebui
  ansible.builtin.systemd_service:
    scope: "user"
    name: "openwebui.service"
    state: "started"
    daemon_reload: true
  register: "containers_openwebui_started"

- name: Apply the openwebui configuration handlers
  ansible.builtin.meta: "flush_handlers"
