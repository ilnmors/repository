---
- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "loki"

- name: Register the missing loki certificate # noqa: var-naming[no-role-prefix]
  vars:
    target_service: "{{ services['containers']['loki']['units']['main'] }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "x509-leaf"
  when: >-
    (secrets['ca']['x509']['leaf'][services['containers']['loki']['units']['main']['domain']['internal']]['crt'] | default('', true) | length) == 0 or
    (secrets['ca']['x509']['leaf'][services['containers']['loki']['units']['main']['domain']['internal']]['key'] | default('', true) | length) == 0
  no_log: true

- name: Create the loki directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['loki']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['home'] }}/containers/loki"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/loki/etc"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/loki/ssl"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/loki"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/loki/data"
  become: true

- name: Deploy the loki configuration
  ansible.builtin.template:
    src: "loki/etc/loki.yaml.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/loki/etc/loki.yaml"
    owner: "{{ services['containers']['loki']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0600"
  become: true
  notify: "notification_restart_loki"

- name: Deploy the loki certificate and key
  ansible.builtin.copy:
    content: |
      {{ item['value'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/loki/ssl/{{ item['name'] }}"
    owner: "{{ services['containers']['loki']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "{{ item['mode'] }}"
  loop:
    - name: "{{ site['ca']['x509']['root']['certificate_file'] }}"
      value: "{{ secrets['ca']['x509']['root']['crt'] }}"
      mode: "0440"
    - name: "{{ services['containers']['loki']['units']['main']['domain']['internal'] }}.crt"
      value: |
        {{ secrets['ca']['x509']['leaf'][services['containers']['loki']['units']['main']['domain']['internal']]['crt'] | trim }}
        {{ secrets['ca']['x509']['intermediate']['crt'] }}
      mode: "0440"
    - name: "{{ services['containers']['loki']['units']['main']['domain']['internal'] }}.key"
      value: "{{ secrets['ca']['x509']['leaf'][services['containers']['loki']['units']['main']['domain']['internal']]['key'] }}"
      mode: "0400"
  become: true
  notify: "notification_restart_loki"
  no_log: true

- name: Deploy the loki image
  vars:
    containers_image_notifications: "notification_restart_loki"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the container file
  ansible.builtin.template:
    src: "loki/loki.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/loki.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_loki"

- name: Start the loki
  ansible.builtin.systemd_service:
    scope: "user"
    name: "loki.service"
    state: "started"
    daemon_reload: true
  register: "containers_loki_started"

- name: Apply the loki configuration handlers
  ansible.builtin.meta: "flush_handlers"

- name: Wait for the loki server
  ansible.builtin.uri:
    url: "https://{{ services['containers']['loki']['units']['main']['domain']['internal'] }}.{{ site['domain']['internal'] }}:{{ services['containers']['loki']['units']['main']['ports']['https']['int'] }}/ready"
    ca_path: "{{ nodes[target_host]['paths']['home'] }}/containers/loki/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    status_code: 200
    use_proxy: false
  until: containers_loki_ready['status'] | default(0) == 200
  retries: 20
  delay: 3
  register: "containers_loki_ready"
