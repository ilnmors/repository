---
- name: Include the step-ca task
  ansible.builtin.include_tasks:
    file: "step-ca.yaml"
    apply:
      tags: ["step-ca"]
  when: target_host in services['containers']['step-ca']['units']['main']['hosts']
  tags: ["step-ca"]

- name: Include the caddy task
  ansible.builtin.include_tasks:
    file: "caddy.yaml"
    apply:
      tags: ["caddy"]
  when: target_host in services['containers']['caddy']['units']['main']['hosts']
  tags: ["caddy"]

- name: Include the rustfs task
  ansible.builtin.include_tasks:
    file: "rustfs.yaml"
    apply:
      tags: ["rustfs"]
  when: target_host in services['containers']['rustfs']['units']['main']['hosts']
  tags: ["rustfs"]

- name: Include the postgresql task
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      tags: ["postgresql"]
  when: target_host in services['containers']['postgresql']['units']['main']['hosts']
  tags: ["postgresql"]

- name: Include the mariadb task
  ansible.builtin.include_tasks:
    file: "mariadb.yaml"
    apply:
      tags: ["mariadb"]
  when: target_host in services['containers']['mariadb']['units']['main']['hosts']
  tags: ["mariadb"]

- name: Include the ldap task
  ansible.builtin.include_tasks:
    file: "ldap.yaml"
    apply:
      tags: ["ldap"]
  when: target_host in services['containers']['ldap']['units']['main']['hosts']
  tags: ["ldap"]

- name: Apply the containers configuration handlers
  ansible.builtin.meta: "flush_handlers"
