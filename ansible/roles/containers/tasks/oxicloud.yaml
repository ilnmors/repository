---
- name: Register the oxicloud database and account # noqa: var-naming[no-role-prefix]
  vars:
    containers_postgresql_client: "oxicloud"
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql-register.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the oxicloud authelia client # noqa: var-naming[no-role-prefix]
  vars:
    containers_authelia_client: "oxicloud"
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia-register.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "oxicloud"

- name: Register the missing oxicloud JWT secret on secrets.yaml
  vars:
    secrets_target: '["oxicloud"]["jwt_secret"]'
    secrets_content: "{{ lookup('ansible.builtin.pipe', 'openssl rand -hex 32') | to_json }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "update"
  when: (secrets['oxicloud']['jwt_secret'] | default('', true) | length) == 0
  no_log: true

- name: Set the oxicloud fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "OXICLOUD_JWT_SECRET"
        value: "{{ secrets['oxicloud']['jwt_secret'] }}"
      - name: "OXICLOUD_OIDC_CLIENT_SECRET"
        value: "{{ secrets['authelia']['oidc']['clients']['oxicloud']['secret'] }}"
      - name: "OXICLOUD_DB_CONNECTION_STRING"
        value: "postgres://oxicloud:{{ secrets['postgresql']['password']['oxicloud'] | urlencode | replace('/', '%2F') }}\
          @{{ services['containers']['postgresql']['units']['main']['domain']['internal'] }}.{{ site['domain']['internal'] }}\
          :{{ services['containers']['postgresql']['units']['main']['ports']['tcp']['int'] }}/\
          oxicloud_db?sslmode=verify-full&sslrootcert=/etc/ssl/oxicloud/{{ site['ca']['x509']['root']['certificate_file'] }}"
  no_log: true

- name: Create the oxicloud directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ services['containers']['oxicloud']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/oxicloud"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/oxicloud/storage"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/oxicloud"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/oxicloud/ssl"
  become: true

- name: Deploy the oxicloud root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/oxicloud/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ services['containers']['oxicloud']['units']['main']['subuid'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_oxicloud"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_oxicloud"
  no_log: true

- name: Deploy the oxicloud image
  vars:
    containers_image_notifications: "notification_restart_oxicloud"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

- name: Deploy the container file
  ansible.builtin.template:
    src: "oxicloud/oxicloud.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/oxicloud.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_oxicloud"

- name: Start the oxicloud
  ansible.builtin.systemd_service:
    scope: "user"
    name: "oxicloud.service"
    state: "started"
    daemon_reload: true
  register: "containers_oxicloud_started"

- name: Apply the oxicloud configuration handlers
  ansible.builtin.meta: "flush_handlers"
