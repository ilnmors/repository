---
- name: Register the readur database and account # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_postgresql_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_postgresql_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "postgresql.yaml"
    apply:
      delegate_to: "{{ containers_postgresql_host }}"

- name: Register the readur rustfs client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_rustfs_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_rustfs_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "rustfs.yaml"
    apply:
      delegate_to: "{{ containers_rustfs_host }}"

- name: Register the readur authelia client # noqa: var-naming[no-role-prefix]
  vars:
    target_host: "{{ containers_authelia_host }}"
    ansible_become_pass: "{{ secrets['sudo'][containers_authelia_host]['password'] }}"
  ansible.builtin.include_tasks:
    file: "authelia.yaml"
    apply:
      delegate_to: "{{ containers_authelia_host }}"

- name: Set the target container # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    target_container: "readur"

- name: Register the missing readur jwt secret on secrets.yaml
  vars:
    secrets_target: '["readur"]["jwt_secret"]'
    secrets_content: "{{ lookup('ansible.builtin.pipe', 'openssl rand -hex 32') | to_json }}"
  ansible.builtin.include_role:
    name: "secrets"
    tasks_from: "update"
  when: (secrets['readur']['jwt_secret'] | default('', true) | length) == 0
  no_log: true

- name: Set the readur fact
  ansible.builtin.set_fact:
    containers_secrets:
      - name: "READUR_JWT_SECRET"
        value: "{{ secrets['readur']['jwt_secret'] }}"
      - name: "READUR_DATABASE_URL"
        value: "postgresql://readur:{{ secrets['postgresql']['password']['readur'] | urlencode | replace('/', '%2F') }}@{{ services['containers']['postgresql']['units']['main']['domain']['internal'] }}.{{ site['domain']['internal'] }}/readur_db?sslmode=verify-full&sslrootcert=/etc/ssl/readur/{{ site['ca']['x509']['root']['certificate_file'] }}"
      - name: "READUR_OIDC_CLIENT_SECRET"
        value: "{{ secrets['readur']['oidc']['secret'] }}"
      - name: "READUR_S3_SECRET_KEY"
        value: "{{ secrets['rustfs']['password']['readur'] }}"
  no_log: true

- name: Create the readur directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0770"
  loop:
    - "{{ nodes[target_host]['paths']['data'] }}/containers/readur"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/readur/uploads"
    - "{{ nodes[target_host]['paths']['data'] }}/containers/readur/watch"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/readur"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/readur/ssl"
    - "{{ nodes[target_host]['paths']['home'] }}/containers/readur/patches"
  become: true

- name: Deploy the readur root certificate
  ansible.builtin.copy:
    content: |
      {{ secrets['ca']['x509']['root']['crt'] }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/readur/ssl/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_readur"
  no_log: true

- name: Register the podman secrets
  ansible.builtin.include_tasks:
    file: "secret.yaml"
    apply:
      notify: "notification_restart_readur"
  no_log: true

- name: Deploy the readur image
  vars:
    containers_image_notifications: "notification_restart_readur"
  ansible.builtin.include_tasks:
    file: "deploy.yaml"

# Readur always opens a document on the Text tab (extracted text). Rewrite the
# drawer chunk of the deployed image to open on the Details tab and mount it over
# the original. The chunk name carries a build hash, so it is looked up per image.
- name: Find the readur document drawer chunk
  ansible.builtin.shell: |
    set -o pipefail
    podman run --rm --network=none --entrypoint sh \
      "{{ containers_container_repository }}:{{ releases['containers'][target_container]['tag'] }}" \
      -c 'ls /app/frontend/dist/assets' | grep -E '^DocumentDrawer-[A-Za-z0-9_-]+\.js$'
  args:
    executable: "/bin/bash"
  register: "containers_readur_drawer_chunk_result"
  changed_when: false

- name: Set the readur drawer chunk name
  ansible.builtin.set_fact:
    containers_readur_drawer_chunk: "{{ containers_readur_drawer_chunk_result['stdout_lines'] | first }}"
  failed_when: (containers_readur_drawer_chunk_result['stdout_lines'] | length) != 1

- name: Read the readur document drawer chunk
  ansible.builtin.command: >-
    podman run --rm --network=none --entrypoint cat
    "{{ containers_container_repository }}:{{ releases['containers'][target_container]['tag'] }}"
    /app/frontend/dist/assets/{{ containers_readur_drawer_chunk }}
  register: "containers_readur_drawer_source"
  changed_when: false

- name: Check the readur tab defaults
  ansible.builtin.assert:
    that:
      - (containers_readur_drawer_source['stdout'] | regex_findall('useState\)\(`text`\)') | length) == 1
      - (containers_readur_drawer_source['stdout'] | regex_findall('\|\|c\(`text`\)') | length) == 1
    fail_msg: "The Readur drawer code changed; update the Details tab patch before upgrading."
    quiet: true

- name: Deploy the readur drawer patch
  ansible.builtin.copy:
    content: >-
      {{ containers_readur_drawer_source['stdout']
      | regex_replace('useState\)\(`text`\)', 'useState)(`details`)')
      | regex_replace('\|\|c\(`text`\)', '||c(`details`)') }}
    dest: "{{ nodes[target_host]['paths']['home'] }}/containers/readur/patches/{{ containers_readur_drawer_chunk }}"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_readur"

- name: Deploy the readur container file
  ansible.builtin.template:
    src: "readur/readur.container.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/containers/systemd/readur.container"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  notify: "notification_restart_readur"

- name: Start the readur
  ansible.builtin.systemd_service:
    scope: "user"
    name: "readur.service"
    state: "started"
    daemon_reload: true
  register: "containers_readur_started"

- name: Apply the readur configuration handlers
  ansible.builtin.meta: "flush_handlers"
