---
# Quartermaster model files: the containers role downloads each file into DATA (the backed-up copy),
# syncs DATA to HOME (the copy that runs) and config/config.yaml.j2 loads it by role as
# /data/models/<model>/<file name from the URL>. A new URL is a new file name, so changing a quant
# downloads the new file and deletes the old one.
# Language models are heretic (uncensored) builds; embeddings and the VAE have no such variant.

# Fast chat and image understanding on the RX 7900 XT. The MTP head of the original Gemma 4 drafts
# tokens for speculative decoding (the heretic weights only change the refusal direction).
gemma-4-26b-a4b-heretic:
  - role: "model"
    url: "https://huggingface.co/mradermacher/gemma-4-26B-A4B-it-ultra-uncensored-heretic-i1-GGUF/resolve/main/gemma-4-26B-A4B-it-ultra-uncensored-heretic.i1-Q4_K_S.gguf"
  - role: "mmproj"
    url: "https://huggingface.co/llmfan46/gemma-4-26B-A4B-it-ultra-uncensored-heretic-GGUF/resolve/main/gemma-4-26B-A4B-it-mmproj-BF16.gguf"
  - role: "mtp"
    url: "https://huggingface.co/bartowski/google_gemma-4-26B-A4B-it-GGUF/resolve/main/mtp-google_gemma-4-26B-A4B-it-Q8_0.gguf"

# Dense chat for harder work on the RX 7900 XT: the RVN multilingual build with its MTP head embedded.
# Hybrid attention (one full-attention layer in four) keeps the KV cache small.
qwen3.8-27b-heretic:
  - role: "model"
    url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/RVN-Q4_K_S-multilingual-mtp.gguf"
  - role: "mmproj"
    url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/mmproj-Qwen3.8-27B-Q8_0.gguf"

# RAG embeddings on the Iris Xe: multilingual (Korean included), CLS pooling, no query prefix.
bge-m3:
  - role: "model"
    url: "https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf"

# Image generation and editing on the RX 7900 XT (swapped with the chat models): Qwen Image 2.1 Turbo with an
# abliterated (uncensored) Qwen3-VL-8B text encoder and the matching Qwen Image 2.1 VAE.
qwen-image-2.1:
  - role: "diffusion"
    url: "https://huggingface.co/unsloth/Qwen-Image-2.1-Turbo-GGUF/resolve/main/qwen-image-2.1-turbo-Q8_0.gguf"
  - role: "llm"
    url: "https://huggingface.co/AtomicChat/Qwen-Image-2.1-Turbo-Uncensored-GGUF/resolve/main/Qwen-Image-2.1-Turbo-Uncensored-Q8_0.gguf"
  - role: "vae"
    url: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors"
