# Image generation and editing (2026-11-26): Qwen-Image-2.1 Uncensored Omni in Q8_0 (ChatR Labs step 90,000, 7.16 GiB,
# SHA256 58ab4d7b...e5ca) on the RX 7900 XT for all-in-one T2I (photoreal + 2D/NSFW) and native multi-reference I2I.
# Abliterated Qwen3-VL-8B-Instruct Q8_0 text encoder (AtomicChat, 8.11 GiB, SHA256 f8f9f627...d07ca; 2026-11-27,
# replaces Q6_K, which stays in DATA), its F16 vision projector mmproj (1.08 GiB, SHA256 d9870a1f...1ac6) and the
# official Qwen-Image-2.1 BF16 VAE (0.63 GiB, SHA256 bb21f747...b7c9) also run on the RX 7900 XT. ChatR Labs 8-step Turbo LoRA (0.63 GiB, SHA256 77e8863b...94b43) is
# applied automatically by sd-server for 8-step CFG 1.0 generation (~22-36 s T2I, ~64 s I2I).
qwen-image-2.1:
  - role: "diffusion"
    url: "https://huggingface.co/chatrlabs/Qwen-Image-2.1-Uncensored-Omni-Quantized/resolve/main/qwen-image-2.1-step90000-Q8_0.gguf"
  - role: "llm"
    url: "https://huggingface.co/AtomicChat/Qwen-Image-2.1-Turbo-Uncensored-GGUF/resolve/main/Qwen-Image-2.1-Turbo-Uncensored-Q8_0.gguf"
  - role: "llm_vision"
    url: "https://huggingface.co/AtomicChat/Qwen-Image-2.1-Turbo-Uncensored-GGUF/resolve/main/mmproj-Qwen-Image-2.1-Turbo-Uncensored-F16.gguf"
  - role: "vae"
    url: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors"
  - role: "lora"
    url: "https://huggingface.co/chatrlabs/Qwen-Image-2.1-Uncensored-Omni-LoRA-v0.1/resolve/main/chatrlabs-omni-turbo-8step-fp32.safetensors"
    file: "loras/chatrlabs-omni-turbo-8step-fp32.safetensors"

# Image to video (2026-11-22): DaSiWa WAN 2.2 I2V 14B SynthSeduction v9 Lightspeed (Darksidewalker, Civitai model
# 2269796), an uncensored Wan 2.2 I2V A14B merge with the 4-step distillation baked in. Wan 2.2 A14B samples with a
# high-noise and a low-noise transformer (Q8_0, 15 GB each). Civitai needs an account key, so both are placed in
# DATA by hand (SHA256 4db65f7a...dd79c207 high, 99cded93...e4a8fbf102 low). umT5-XXL text encoder and the Wan 2.1 VAE.
wan2.2-enhanced-i2v:
  - role: "high_noise"
    url: "https://civitai.red/api/download/models/2540892?fileId=2429064"
    file: "Wan2_2-I2V-Enhanced-High_FP8.gguf"
    manual: true
  - role: "diffusion"
    url: "https://civitai.red/api/download/models/2540896?fileId=2429066"
    file: "Wan2_2-I2V-Enhanced-Low_FP8.gguf"
    manual: true
  - role: "t5xxl"
    url: "https://huggingface.co/city96/umt5-xxl-encoder-gguf/resolve/main/umt5-xxl-encoder-Q8_0.gguf"
  - role: "vae"
    url: "https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors"
