---
containers_service_list: "{{ (services['packages'] | dict2items) + (services['containers'] | dict2items) }}"

containers_unit_entries: >-
  {%- set containers_found = namespace(units=[]) -%}
  {%- for containers_service in containers_service_list -%}
  {%-   set containers_found.units = containers_found.units + (
          containers_service['value']['units'] | default({}) | dict2items
          | map('combine', {'service': containers_service['key']}) | list
        ) -%}
  {%- endfor -%}
  {{ containers_found.units }}

containers_postgresql_host: "{{ services['containers']['postgresql']['units']['main']['hosts'] | first }}"

containers_mariadb_host: "{{ services['containers']['mariadb']['units']['main']['hosts'] | first }}"

containers_step_ca_allowed_domains: >-
  {{
    networks['segments']
    | dict2items
    | map(attribute='value.hosts') | map('default', {}) | map('dict2items') | flatten
    | map(attribute='value.alias') | select('defined') | flatten
    | unique
    | map('regex_replace', '$', '.' ~ site['domain']['internal'])
    | list
  }}

containers_postgresql_services: >-
  {{
    containers_unit_entries
    | selectattr('value.dependency.db.status', 'defined')
    | selectattr('value.dependency.db.status', 'equalto', true)
    | selectattr('value.dependency.db.type', 'defined')
    | selectattr('value.dependency.db.type', 'equalto', 'postgresql')
    | map(attribute='service') | unique | list
  }}

containers_mariadb_services: >-
  {{
    containers_unit_entries
    | selectattr('value.dependency.db.status', 'defined')
    | selectattr('value.dependency.db.status', 'equalto', true)
    | selectattr('value.dependency.db.type', 'defined')
    | selectattr('value.dependency.db.type', 'equalto', 'mariadb')
    | map(attribute='service') | unique | list
  }}

containers_postgresql_client_hosts: >-
  {{
    containers_unit_entries
    | selectattr('value.dependency.db.status', 'defined')
    | selectattr('value.dependency.db.status', 'equalto', true)
    | selectattr('value.dependency.db.type', 'defined')
    | selectattr('value.dependency.db.type', 'equalto', 'postgresql')
    | map(attribute='value.hosts') | flatten | unique | sort
    | list
  }}

containers_rustfs_units: >-
  {{
    containers_unit_entries
    | selectattr('value.dependency.s3.status', 'defined')
    | selectattr('value.dependency.s3.status', 'equalto', true)
    | map(attribute='value')
    | list
  }}

containers_rustfs_clients: >-
  {%- set containers_found = namespace(clients=[]) -%}
  {%- for containers_service in containers_service_list -%}
  {%-   set containers_units = (
          containers_service['value']['units'] | default({}) | dict2items
          | map(attribute='value')
          | selectattr('dependency.s3.status', 'defined')
          | selectattr('dependency.s3.status', 'equalto', true)
          | list
        ) -%}
  {%-   if (containers_units | length) > 0 -%}
  {%-     set containers_definitions = containers_units | map(attribute='dependency.s3') | unique | list -%}
  {%-     set containers_found.clients = containers_found.clients + [{
            'name': containers_service['key'],
            'access_key': (containers_definitions | first)['access_key'] | default(containers_service['key']),
            's3': containers_definitions | first,
            'definitions': containers_definitions
          }] -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ containers_found.clients }}

containers_rustfs_cors_origins: >-
  {{
    (
      (
        containers_rustfs_units
        | map(attribute='domain.internal') | map('default', '', true) | select
        | map('regex_replace', '^(.+)$', 'https://\1.' ~ site['domain']['internal'])
        | map('regex_replace', '^https://@[.]', 'https://')
        | list
      ) + (
        containers_rustfs_units
        | map(attribute='domain.public') | map('default', '', true) | select
        | map('regex_replace', '^(.+)$', 'https://\1.' ~ site['domain']['public'])
        | map('regex_replace', '^https://@[.]', 'https://')
        | list
      )
    )
    | unique
    | list
  }}

containers_x509_exporter_leaf_domains: >-
  {{
    containers_unit_entries
    | selectattr('value.dependency.pki.cert', 'defined')
    | selectattr('value.dependency.pki.cert', 'equalto', true)
    | map(attribute='value.domain.internal')
    | unique | sort
    | list
  }}

containers_x509_exporter_certs: >-
  {{
    [site['ca']['x509']['root']['certificate_file'], site['ca']['x509']['intermediate']['certificate_file']]
    + (containers_x509_exporter_leaf_domains | map('regex_replace', '$', '.crt') | list)
  }}

containers_authelia_host: "{{ services['containers']['authelia']['units']['main']['hosts'] | first }}"

containers_authelia_oidc_clients: >-
  {%- set containers_found = namespace(clients=[]) -%}
  {%- for containers_service in containers_service_list -%}
  {%-   set containers_units = (
          containers_service['value']['units'] | default({}) | dict2items
          | map(attribute='value')
          | selectattr('dependency.oidc.status', 'defined')
          | selectattr('dependency.oidc.status', 'equalto', true)
          | list
        ) -%}
  {%-   if (containers_units | length) > 0 -%}
  {%-     set containers_unit = containers_units | first -%}
  {%-     set containers_domain = containers_unit['domain']['public'] | default('', true) -%}
  {%-     set containers_found.clients = containers_found.clients + [{
            'name': containers_service['key'],
            'url': 'https://' ~ (
              site['domain']['public']
              if containers_domain == '@'
              else containers_domain ~ '.' ~ site['domain']['public']
            ),
            'oidc': containers_unit['dependency']['oidc'],
            'definitions': containers_units | map(attribute='dependency.oidc') | unique | list
          }] -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ containers_found.clients }}

containers_podman_gateway: "169.254.1.2"

containers_trusted_proxies: >-
  {{
    [containers_podman_gateway]
    + (
      services['containers']['caddy']['units']['main']['build']['crowdsec-bouncer']['hosts']
      | map('extract', networks['segments']['server']['hosts'])
      | map(attribute='ipv4')
      | list
    )
    + (
      services['containers']['caddy']['units']['main']['build']['crowdsec-bouncer']['hosts']
      | map('extract', networks['segments']['server']['hosts'])
      | selectattr('ipv6', 'defined')
      | map(attribute='ipv6')
      | list
    )
  }}

containers_rustfs_host: "{{ services['containers']['rustfs']['units']['main']['hosts'] | first }}"

