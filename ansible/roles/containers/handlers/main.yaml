---
- name: Restart the step-ca.service
  ansible.builtin.systemd_service:
    scope: "user"
    name: "step-ca.service"
    state: "restarted"
    daemon_reload: true
  when: not (containers_step_ca_started['changed'] | default(false))
  changed_when: false
  register: "result_restart_step_ca"
  listen: "notification_restart_step_ca"
  ignore_errors: true

- name: Restart the caddy.service
  ansible.builtin.systemd_service:
    scope: "user"
    name: "caddy.service"
    state: "restarted"
    daemon_reload: true
  when: not (containers_caddy_started['changed'] | default(false))
  changed_when: false
  register: "result_restart_caddy"
  listen: "notification_restart_caddy"
  ignore_errors: true

- name: Restart the rustfs.service
  ansible.builtin.systemd_service:
    scope: "user"
    name: "rustfs.service"
    state: "restarted"
    daemon_reload: true
  when: not (containers_rustfs_started['changed'] | default(false))
  changed_when: false
  register: "result_restart_rustfs"
  listen: "notification_restart_rustfs"
  ignore_errors: true

- name: Restart the postgresql.service
  ansible.builtin.systemd_service:
    scope: "user"
    name: "postgresql.service"
    state: "restarted"
    daemon_reload: true
  delegate_to: "{{ containers_postgresql_host }}"
  when: not (containers_postgresql_started['changed'] | default(false))
  changed_when: false
  register: "result_restart_postgresql"
  listen: "notification_restart_postgresql"
  ignore_errors: true

- name: Reload the postgresql configuration
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/bin/podman exec -u postgres postgresql sh -c "pg_ctl reload"
  args:
    executable: "/bin/bash"
  delegate_to: "{{ containers_postgresql_host }}"
  when: not (containers_postgresql_started['changed'] | default(false))
  changed_when: false
  register: "result_reload_postgresql"
  listen: "notification_reload_postgresql"
  ignore_errors: true
