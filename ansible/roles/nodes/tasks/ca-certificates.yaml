---
- name: Deploy root ca-certificates
  ansible.builtin.copy:
    content: "{{ secrets['ca']['x509']['root']['crt'] }}"
    dest: "/usr/local/share/ca-certificates/{{ site['ca']['x509']['root']['certificate_file'] }}"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
  notify: "notification_update_ca-certificates"
