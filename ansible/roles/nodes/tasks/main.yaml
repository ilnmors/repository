---
- name: Include the timezone task
  ansible.builtin.include_tasks:
    file: "timezone.yaml"
    apply:
      tags: ["timezone"]
  tags: ["timezone"]

- name: Include the ca-certificates task
  ansible.builtin.include_tasks:
    file: "ca-certificates.yaml"
    apply:
      tags: ["ca-certificates"]
  tags: ["ca-certificates"]

- name: Include the default-dir task
  ansible.builtin.include_tasks:
    file: "default-dir.yaml"
    apply:
      tags: ["default-dir"]
  tags: ["default-dir"]

- name: Include the hosts task
  ansible.builtin.include_tasks:
    file: "hosts.yaml"
    apply:
      tags: ["hosts"]
  tags: ["hosts"]

- name: Include the ssh task
  ansible.builtin.include_tasks:
    file: "ssh.yaml"
    apply:
      tags: ["ssh"]
  tags: ["ssh"]

- name: Include the linger task
  ansible.builtin.include_tasks:
    file: "linger.yaml"
    apply:
      tags: ["linger"]
  tags: ["linger"]

- name: Include the nftables task
  ansible.builtin.include_tasks:
    file: "nftables.yaml"
    apply:
      tags: ["nftables"]
  when: (role_path ~ '/templates/nftables/' ~ target_host ~ '.conf.j2') is file
  tags: ["nftables"]

- name: Include the sysctl task
  ansible.builtin.include_tasks:
    file: "sysctl.yaml"
    apply:
      tags: ["sysctl"]
  when: (role_path ~ '/templates/sysctl/' ~ target_host) is directory
  tags: ["sysctl"]

- name: Include the networkd task
  ansible.builtin.include_tasks:
    file: "networkd.yaml"
    apply:
      tags: ["networkd"]
  when: >-
    (role_path ~ '/templates/networkd/' ~ target_host) is directory or
    nodes[target_host]['system']['nic']['lan'] is defined
  tags: ["networkd"]

- name: Apply the nodes configuration handlers
  ansible.builtin.meta: "flush_handlers"
