---
- name: Include the timezone task
  ansible.builtin.include_tasks:
    file: "timezone.yaml"
    apply:
      tags: ["timezone"]
  tags: ["timezone"]

- name: Include the ca-certificates task
  ansible.builtin.include_tasks:
    file: "ca-certificates.yaml"
    apply:
      tags: ["ca-certificates"]
  tags: ["ca-certificates"]

- name: Include the default-dir task
  ansible.builtin.include_tasks:
    file: "default-dir.yaml"
    apply:
      tags: ["default-dir"]
  tags: ["default-dir"]

- name: Include the hosts task
  ansible.builtin.include_tasks:
    file: "hosts.yaml"
    apply:
      tags: ["hosts"]
  tags: ["hosts"]

- name: Include the ssh task
  ansible.builtin.include_tasks:
    file: "ssh.yaml"
    apply:
      tags: ["ssh"]
  tags: ["ssh"]

- name: Include the linger task
  ansible.builtin.include_tasks:
    file: "linger.yaml"
    apply:
      tags: ["linger"]
  tags: ["linger"]

- name: Include the nftables task
  ansible.builtin.include_tasks:
    file: "nftables.yaml"
    apply:
      tags: ["nftables"]
  when: (role_path ~ '/templates/nftables/' ~ target_host ~ '.conf.j2') is file
  tags: ["nftables"]

- name: Include the sysctl task
  ansible.builtin.include_tasks:
    file: "sysctl.yaml"
    apply:
      tags: ["sysctl"]
  when: (role_path ~ '/templates/sysctl/' ~ target_host) is directory
  tags: ["sysctl"]

- name: Include the networkd task
  ansible.builtin.include_tasks:
    file: "networkd.yaml"
    apply:
      tags: ["networkd"]
  when: >-
    (role_path ~ '/templates/networkd/' ~ target_host) is directory or
    nodes[target_host]['system']['nic']['lan'] is defined
  tags: ["networkd"]

- name: Include the resolved task
  ansible.builtin.include_tasks:
    file: "resolved.yaml"
    apply:
      tags: ["resolved"]
  when: target_host in services['packages']['resolved']['units']['main']['hosts']
  tags: ["resolved"]

- name: Include the timesyncd task
  ansible.builtin.include_tasks:
    file: "timesyncd.yaml"
    apply:
      tags: ["timesyncd"]
  when:
    - not nodes[target_host]['control_node']
    - target_host not in services['packages']['chrony']['units']['main']['hosts']
  tags: ["timesyncd"]

- name: Include the physical-disk task
  when: >-
    not nodes[target_host]['virtualization'] and
    (nodes_physical_disks | length) > 0
  vars:
    nodes_physical_disks: >-
      {{
        nodes[target_host]['system']['disk'] |
        default({}) |
        dict2items |
        selectattr('value.fs', 'defined') |
        selectattr('value.fs.type', 'defined') |
        selectattr('value.fs.type', 'in', ['btrfs', 'swap']) |
        map(attribute='key') |
        list
      }}
  tags: ["physical-disk"]
  block:
    - name: Include the physical-disk task
      ansible.builtin.include_tasks:
        file: "physical-disk.yaml"
        apply:
          tags: ["physical-disk"]
      loop: "{{ nodes_physical_disks }}"
      loop_control:
        loop_var: "nodes_disk"
      tags: ["physical-disk"]

- name: Include the smart-exporter task
  ansible.builtin.include_tasks:
    file: "smart-exporter.yaml"
    apply:
      tags: ["smart-exporter"]
  when: target_host in services['packages']['smart-exporter']['units']['main']['hosts']
  tags: ["smart-exporter"]

- name: Include the gpu task
  ansible.builtin.include_tasks:
    file: "gpu.yaml"
    apply:
      tags: ["gpu"]
  when:
    - nodes[target_host]['virtualization']
    - nodes[target_host]['system']['gpu'] is defined
  tags: ["gpu"]

- name: Apply the nodes configuration handlers
  ansible.builtin.meta: "flush_handlers"
