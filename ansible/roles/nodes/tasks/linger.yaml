---
- name: Install the dbus-user-session package
  ansible.builtin.apt:
    name:
      - "dbus-user-session"
    state: "present"
  become: true

- name: Check the linger status
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ nodes[target_host]['user'] }}"
  register: "is_linger_file"

- name: Activate the linger
  when: not is_linger_file['stat']['exists']
  block:
    - name: Enable the linger
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/bin/loginctl enable-linger {{ nodes[target_host]['user'] }}
        echo "Linger enabled"
      args:
        executable: "/bin/bash"
      become: true
      changed_when: "'Linger enabled' in is_linger_enabled['stdout']"
      register: "is_linger_enabled"

    - name: Reboot the system to ensure the DBUS socket activation
      ansible.builtin.reboot:
        reboot_timeout: 300
        post_reboot_delay: 3
      become: true
      when: not nodes[target_host]['control_node']
