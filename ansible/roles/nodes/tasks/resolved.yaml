---
- name: Install systemd-resolved
  ansible.builtin.apt:
    name:
      - "{{ releases['packages']['resolved']['name'] }}"
    state: "present"
  become: true

- name: Create resolved directory
  ansible.builtin.file:
    path: "/etc/systemd/resolved.conf.d"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  become: true

- name: Deploy global conf file
  ansible.builtin.template:
    src: "resolved/global.conf.j2"
    dest: "/etc/systemd/resolved.conf.d/global.conf"
    owner: "root"
    group: "systemd-resolve"
    mode: "0640"
  become: true
  register: "resolved_configuration"

- name: Enable systemd-resolved.service
  ansible.builtin.systemd_service:
    name: "systemd-resolved.service"
    state: "{{ 'restarted' if resolved_configuration['changed'] else 'started' }}"
    enabled: true
  become: true

- name: Set the systemd-resolved resolver link
  ansible.builtin.file:
    src: "/run/systemd/resolve/stub-resolv.conf"
    dest: "/etc/resolv.conf"
    state: "link"
    force: true
  become: true
