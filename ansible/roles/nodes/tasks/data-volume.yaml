---
# The data volume is formatted as btrfs by vmm and passed to the VM.
# type "block": physical disks (serials). type "file": a raw image on the vmm SSD (one serial).
- name: Set the data disk serials
  ansible.builtin.set_fact:
    nodes_data_serials: >-
      {{
        nodes[target_host]['system']['disk']['data']['serials'] | default([])
        if nodes[target_host]['system']['disk']['data']['type'] == 'block'
        else [nodes[target_host]['system']['disk']['data']['serial'] | default('')] | reject('equalto', '') | list
      }}

- name: Check the data volume configuration
  ansible.builtin.assert:
    that:
      - nodes[target_host]['system']['disk']['data']['type'] in ['block', 'file']
      - (nodes_data_serials | length) > 0
      - nodes[target_host]['system']['disk']['data']['fs']['type'] == 'btrfs'
      - (nodes[target_host]['system']['disk']['data']['fs']['label'] | default('') | length) > 0
      - nodes[target_host]['system']['disk']['data']['fs']['mount_point'] is abs
      - nodes[target_host]['system']['disk']['data']['fs']['mount_point'] != '/'
    success_msg: "The data volume configuration is correct"
    fail_msg: "The data volume needs block disks or a file disk with a serial, a btrfs label and an absolute mount point other than /."

- name: Install the btrfs-progs package
  ansible.builtin.apt:
    name:
      - "btrfs-progs"
    state: "present"
  become: true

- name: Set the data disk path
  ansible.builtin.shell: |
    set -o pipefail
    ls -1 /dev/disk/by-id/*{{ nodes_data_serials | join('* /dev/disk/by-id/*') }}* | \
    grep -vE -- '-part[0-9]+$' | \
    xargs -r readlink -f | \
    sort -u
  args:
    executable: "/bin/bash"
  changed_when: false
  register: "nodes_disk_path"

- name: Load the disk's filesystem
  ansible.builtin.shell: |
    set -o pipefail
    lsblk {{ nodes_disk_path['stdout_lines'] | join(' ') }} -o FSTYPE,LABEL --json
  args:
    executable: "/bin/bash"
  become: true
  changed_when: false
  register: "nodes_disk_fs_info"

- name: Set the disk's filesystem information
  ansible.builtin.set_fact:
    nodes_existing_correct_disk_num: >-
      {{
        (nodes_disk_fs_info['stdout'] | from_json)['blockdevices']
        | selectattr('fstype', 'equalto', 'btrfs')
        | selectattr("label", 'equalto',  nodes[target_host]['system']['disk']['data']['fs']['label'])
        | list
        | length
      }}

- name: Check the disk's filesystem
  ansible.builtin.assert:
    that:
      - >-
        (nodes_disk_path['stdout_lines'] | length)
        == (nodes_data_serials | length)
      - >-
        nodes_existing_correct_disk_num == (nodes_disk_path['stdout_lines'] | length)
    success_msg: "All data disks have the btrfs filesystem from vmm"
    fail_msg: "One or more data disks are missing or do not have the expected btrfs label. Please check vmm and try again."

- name: Scan the btrfs devices
  ansible.builtin.shell: |
    /usr/bin/btrfs device scan
  args:
    executable: "/bin/bash"
  become: true
  changed_when: false

- name: Mount the data volume
  ansible.posix.mount:
    path: "{{ nodes[target_host]['system']['disk']['data']['fs']['mount_point'] }}"
    src: "LABEL={{ nodes[target_host]['system']['disk']['data']['fs']['label'] }}"
    state: "mounted"
    fstype: "{{ nodes[target_host]['system']['disk']['data']['fs']['type'] }}"
    opts: "{{ nodes[target_host]['system']['disk']['data']['fs']['mount_opts'] | join(',') }}"
  become: true

- name: Verify the disk is mounted
  ansible.builtin.shell: |
    mountpoint -q {{ nodes[target_host]['system']['disk']['data']['fs']['mount_point'] | quote }}
  args:
    executable: "/bin/bash"
  become: true
  changed_when: false

- name: Grow the file data volume to the image size
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/bin/btrfs filesystem resize max {{ nodes[target_host]['system']['disk']['data']['fs']['mount_point'] | quote }}
  args:
    executable: "/bin/bash"
  become: true
  changed_when: false
  when: nodes[target_host]['system']['disk']['data']['type'] == 'file'

- name: Set the data volume path permissions
  ansible.builtin.file:
    path: "{{ nodes[target_host]['system']['disk']['data']['fs']['mount_point'] }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  become: true

- name: Deploy the btrfs scrub service and timer
  vars:
    nodes_disk: "data"
  ansible.builtin.template:
    src: "disk/btrfs/btrfs-scrub.{{ item }}.j2"
    dest: "/etc/systemd/system/btrfs-scrub-{{ nodes_disk }}.{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop:
    - "service"
    - "timer"
  become: true

- name: Enable the btrfs scrub timer
  vars:
    nodes_disk: "data"
  ansible.builtin.systemd_service:
    name: "btrfs-scrub-{{ nodes_disk }}.timer"
    state: "started"
    enabled: true
    daemon_reload: true
  become: true
