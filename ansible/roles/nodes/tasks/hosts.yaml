---
# The hostname must match the 127.0.1.1 entry below, otherwise sudo waits on name resolution
# (about 30 s per call) and Ansible's become times out. The first become after a rename is slow once.
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ target_host }}"
    use: "systemd"
  become: true

- name: Deploy the /etc/hosts file
  ansible.builtin.template:
    src: "hosts/hosts.j2"
    dest: "/etc/hosts"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
