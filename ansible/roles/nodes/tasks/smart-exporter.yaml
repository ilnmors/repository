---
- name: Install the SMART exporter dependencies
  ansible.builtin.apt:
    name:
      - "{{ releases['packages']['smart-exporter']['name'] }}"
      - "{{ releases['packages']['jq']['name'] }}"
    state: "present"
  become: true

- name: Create the SMART exporter result directory
  ansible.builtin.file:
    path: "/etc/smartctl-exporter"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  become: true

- name: Deploy the SMART exporter script
  ansible.builtin.template:
    src: "disk/smart/smart-exporter.sh.j2"
    dest: "/usr/local/sbin/smart-exporter.sh"
    owner: "root"
    group: "root"
    mode: "0711"
    validate: "/bin/bash -n %s"
  become: true

- name: Deploy the SMART exporter service files
  ansible.builtin.template:
    src: "disk/smart/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0600"
    validate: "/usr/bin/systemd-analyze verify --man=no %s:{{ item }}"
  loop:
    - "smart-exporter.service"
    - "smart-exporter.timer"
  become: true

- name: Register the smart-exporter.timer
  ansible.builtin.systemd_service:
    name: "smart-exporter.timer"
    state: "started"
    enabled: true
    daemon_reload: true
  become: true
