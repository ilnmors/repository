---
- name: Update the root ca-certificates
  ansible.builtin.shell: |
    /usr/sbin/update-ca-certificates
  args:
    executable: "/bin/bash"
  become: true
  changed_when: false
  register: "result_update_ca"
  listen: "notification_update_ca-certificates"
  ignore_errors: true

- name: Reload the nftables.service
  ansible.builtin.systemd_service:
    name: "nftables.service"
    state: "reloaded"
    enabled: true
  become: true
  changed_when: false
  register: "result_reload_nftables"
  listen: "notification_reload_nftables"
  ignore_errors: true

- name: Restart the systemd-sysctl.service
  ansible.builtin.systemd_service:
    name: "systemd-sysctl.service"
    state: "restarted"
  become: true
  changed_when: false
  register: "result_restart_sysctl"
  listen: "notification_restart_sysctl"
  ignore_errors: true

- name: Restart the systemd-networkd.service
  ansible.builtin.systemd_service:
    name: "systemd-networkd.service"
    state: "restarted"
    enabled: true
  become: true
  changed_when: false
  register: "result_restart_networkd"
  listen: "notification_restart_networkd"
  ignore_errors: true

- name: Restart the sshd.service
  ansible.builtin.systemd_service:
    name: "sshd.service"
    state: "restarted"
    enabled: true
  become: true
  changed_when: false
  register: "result_restart_sshd"
  listen: "notification_restart_sshd"
  ignore_errors: true

- name: Update the initramfs
  ansible.builtin.shell: |
    /usr/sbin/update-initramfs -u
  args:
    executable: "/bin/bash"
  become: true
  changed_when: false
  register: "result_update_initramfs"
  listen: "notification_update_initramfs"
  ignore_errors: true

- name: Reboot the node
  ansible.builtin.reboot:
    reboot_timeout: 300
    post_reboot_delay: 3
  become: true
  when: not nodes[target_host]['control_node']
  changed_when: false
  register: "result_reboot"
  listen: "notification_reboot"
  ignore_errors: true
