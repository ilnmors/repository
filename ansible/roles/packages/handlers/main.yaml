---
- name: Restart code-server.service
  ansible.builtin.systemd_service:
    name: "code-server.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
    scope: "user"
  changed_when: false
  listen: "notification_restart_code-server"
  register: "result_restart_code_server"
  ignore_errors: true

- name: Restart systemd-networkd.service
  ansible.builtin.systemd_service:
    name: "systemd-networkd.service"
    state: "restarted"
    enabled: true
  become: true
  changed_when: false
  listen: "notification_restart_networkd"
  register: "result_restart_networkd"
  ignore_errors: true

- name: Restart named.service
  ansible.builtin.systemd_service:
    name: "named.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  become: true
  changed_when: false
  listen: "notification_restart_bind"
  register: "result_restart_bind"
  ignore_errors: true

- name: Restart kea-dhcp4-server.service
  ansible.builtin.systemd_service:
    name: "kea-dhcp4-server.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  become: true
  changed_when: false
  listen: "notification_restart_kea"
  register: "result_restart_kea"
  ignore_errors: true

- name: Restart chrony.service
  ansible.builtin.systemd_service:
    name: "chrony.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  become: true
  changed_when: false
  listen: "notification_restart_chrony"
  register: "result_restart_chrony"
  ignore_errors: true

- name: Restart crowdsec.service
  ansible.builtin.systemd_service:
    name: "crowdsec.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  become: true
  changed_when: false
  listen: "notification_restart_crowdsec"
  register: "result_restart_crowdsec"
  ignore_errors: true

- name: Restart crowdsec-firewall-bouncer.service
  ansible.builtin.systemd_service:
    name: "crowdsec-firewall-bouncer.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  when: target_host in services['packages']['crowdsec']['units']['fw-bouncer']['hosts']
  become: true
  changed_when: false
  listen: "notification_restart_crowdsec_bouncer"
  register: "result_restart_crowdsec_bouncer"
  ignore_errors: true

- name: Restart suricata.service
  ansible.builtin.systemd_service:
    name: "suricata.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  become: true
  changed_when: false
  listen: "notification_restart_suricata"
  register: "result_restart_suricata"
  ignore_errors: true

- name: Restart suricata-update.timer
  ansible.builtin.systemd_service:
    name: "suricata-update.timer"
    state: "restarted"
    enabled: true
    daemon_reload: true
  when: target_host in services['packages']['suricata']['units']['update']['hosts']
  become: true
  changed_when: false
  listen: "notification_restart_suricata_update_timer"
  register: "result_restart_suricata_update_timer"
  ignore_errors: true

- name: Restart kopia-server.service
  ansible.builtin.systemd_service:
    name: "kopia-server.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
  when: target_host in services['packages']['kopia']['units']['server']['hosts']
  become: true
  changed_when: false
  listen: "notification_restart_kopia_server"
  register: "result_restart_kopia_server"
  ignore_errors: true

- name: Restart alloy.service
  ansible.builtin.systemd_service:
    name: "alloy.service"
    state: "restarted"
    daemon_reload: true
  when: not (packages_alloy_started['changed'] | default(false))
  become: true
  changed_when: false
  listen: "notification_restart_alloy"
  register: "result_restart_alloy"
  ignore_errors: true
