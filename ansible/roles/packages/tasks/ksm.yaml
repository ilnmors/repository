---
- name: Enable the ksm.service
  ansible.builtin.systemd_service:
    name: "ksm.service"
    state: "started"
    enabled: true
  become: true

- name: Enable the ksmtuned.service
  ansible.builtin.systemd_service:
    name: "ksmtuned.service"
    state: "started"
    enabled: true
  become: true
  when: target_host in services['packages']['ksm']['units']['tuned']['hosts']

- name: Disable the ksmtuned.service
  ansible.builtin.systemd_service:
    name: "ksmtuned.service"
    state: "stopped"
    enabled: false
  become: true
  when: target_host in services['packages']['ksm']['units']['static']['hosts']
