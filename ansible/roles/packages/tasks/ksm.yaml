---
- name: Enable ksm.service
  ansible.builtin.systemd_service:
    name: "ksm.service"
    state: "started"
    enabled: true
  become: true

- name: Enable ksmtuned.service
  ansible.builtin.systemd_service:
    name: "ksmtuned.service"
    state: "started"
    enabled: true
  when: target_host in services['packages']['ksm']['units']['tuned']['hosts']
  become: true

- name: Disable ksmtuned.service
  ansible.builtin.systemd_service:
    name: "ksmtuned.service"
    state: "stopped"
    enabled: false
  when: target_host in services['packages']['ksm']['units']['static']['hosts']
  become: true
