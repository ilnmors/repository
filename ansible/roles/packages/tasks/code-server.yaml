---
- name: Install the code-server package
  vars:
    packages_download_url: "https://github.com/coder/code-server/releases/download/v{{ releases['packages']['code-server']['version'] }}/\
      code-server_{{ releases['packages']['code-server']['version'] }}_{{ packages_host_architecture }}.deb"
    packages_name: "{{ releases['packages']['code-server']['name'] }}_{{ releases['packages']['code-server']['version'] }}_{{ packages_host_architecture }}.deb"
  ansible.builtin.include_tasks:
    file: "install.yaml"

- name: List the installed code-server extensions
  ansible.builtin.shell: |
    /usr/bin/code-server --list-extensions
  args:
    executable: "/bin/bash"
  changed_when: false
  register: "packages_code_server_extensions"

- name: Install the missing code-server extensions
  ansible.builtin.shell: |
    /usr/bin/code-server --install-extension {{ item | quote }}
  args:
    executable: "/bin/bash"
  loop:
    - "redhat.ansible"
    - "redhat.vscode-yaml"
    - "ms-python.python"
    - "mhutchie.git-graph"
    - "continue.continue"
  when: item not in packages_code_server_extensions['stdout_lines']
  changed_when: true

- name: Deploy the Python environment tools helper
  ansible.builtin.template:
    src: "code-server/repair-python-tools.py.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.local/share/code-server/repair-python-tools.py"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0755"

- name: Install the missing Python environment tools
  ansible.builtin.shell: |
    /usr/bin/python3 {{ (nodes[target_host]['paths']['home'] ~ '/.local/share/code-server/repair-python-tools.py') | quote }}
  args:
    executable: "/bin/bash"
  register: "packages_code_server_python_tools"
  changed_when: "'Python environment tools installed:' in packages_code_server_python_tools['stdout']"

- name: Create the Continue directory
  ansible.builtin.file:
    path: "{{ nodes[target_host]['paths']['home'] }}/.continue"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0700"

- name: Deploy the Continue configuration
  ansible.builtin.template:
    src: "continue/config.yaml.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.continue/config.yaml"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"

- name: Deploy the Open WebUI API key for Continue
  ansible.builtin.copy:
    content: "OPENWEBUI_API_KEY={{ secrets['openwebui']['api']['console'] }}\n"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.continue/.env"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0600"
  no_log: true

- name: Create the VS Code settings directory
  ansible.builtin.file:
    path: "{{ item }}/.vscode"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0755"
  loop:
    - "{{ nodes[target_host]['paths']['workspace'] }}"
    - "{{ nodes[target_host]['paths']['repository'] }}"

- name: Deploy the VS Code settings file
  ansible.builtin.template:
    src: "code-server/settings.json.j2"
    dest: "{{ item }}/.vscode/settings.json"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
  loop:
    - "{{ nodes[target_host]['paths']['workspace'] }}"
    - "{{ nodes[target_host]['paths']['repository'] }}"

- name: Create the user systemd directory
  ansible.builtin.file:
    path: "{{ nodes[target_host]['paths']['home'] }}/.config/systemd/user"
    state: "directory"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0700"

- name: Deploy the code-server service file
  ansible.builtin.template:
    src: "code-server/code-server.service.j2"
    dest: "{{ nodes[target_host]['paths']['home'] }}/.config/systemd/user/code-server.service"
    owner: "{{ nodes[target_host]['user'] }}"
    group: "{{ nodes[target_host]['group'] }}"
    mode: "0644"
    validate: "/usr/bin/systemd-analyze verify %s"
  notify: "notification_restart_code-server"

- name: Enable the code-server.service
  ansible.builtin.systemd_service:
    name: "code-server.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"
