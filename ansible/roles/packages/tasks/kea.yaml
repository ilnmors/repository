---
# No validate: the Debian AppArmor profile lets kea-dhcp4 read only /etc/kea and grants no
# dac_override, so it cannot check template's temporary file under ~/.ansible/tmp.
- name: Deploy the kea-dhcp4 configuration
  ansible.builtin.template:
    src: "kea/kea-dhcp4.conf.j2"
    dest: "/etc/kea/kea-dhcp4.conf"
    owner: "_kea"
    group: "_kea"
    mode: "0600"
  become: true
  notify: "notification_restart_kea"

- name: Enable the kea-dhcp4-server.service
  ansible.builtin.systemd_service:
    name: "kea-dhcp4-server.service"
    state: "started"
    enabled: true
  become: true
