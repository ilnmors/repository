---
- name: Deploy the local acl file
  ansible.builtin.template:
    src: "chrony/acl.conf.j2"
    dest: "/etc/chrony/conf.d/acl.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
  notify: "notification_restart_chrony"

- name: Enable the chrony.service
  ansible.builtin.systemd_service:
    name: "chrony.service"
    state: "started"
    enabled: true
    daemon_reload: true
  become: true
