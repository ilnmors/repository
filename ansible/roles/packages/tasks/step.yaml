---
- name: Install step-cli
  vars:
    packages_download_url: "https://dl.smallstep.com/gh-release/cli/gh-release-header/v{{ releases['packages']['step']['version'] }}/\
      step-cli_{{ releases['packages']['step']['version'] }}-1_{{ packages_host_architecture }}.deb"
    packages_name: "{{ releases['packages']['step']['name'] }}_{{ releases['packages']['step']['version'] }}_{{ packages_host_architecture }}.deb"
  ansible.builtin.include_tasks:
    file: "install.yaml"
