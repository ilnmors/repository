---
packages_all_package_list: >-
  {{
    releases['packages']
    | dict2items
    | selectattr('value.source', 'defined')
    | selectattr('value.source', 'equalto', 'debian')
    | map(attribute='key')
    | list
  }}

packages_host_package_list: >-
  {{
    services['packages']
    | dict2items
    | selectattr('value.units', 'defined')
    | map(attribute='value.units')
    | map('dict2items')
    | flatten
    | selectattr('value.hosts', 'defined')
    | selectattr('value.hosts', 'contains', target_host)
    | map(attribute='value.release')
    | unique
    | list
  }}

packages_host_debian_package_list: >-
  {{
    packages_all_package_list
    | select('in', packages_host_package_list)
    | map('extract', releases['packages'])
    | map(attribute='name')
    | unique
    | list
  }}

packages_backup_path: "{{ nodes[target_host]['system']['disk']['backup']['fs']['mount_point'] }}"

packages_kopia_backup_path: "{{ nodes[target_host]['paths']['workspace'] | default(nodes[target_host]['paths']['data']) }}"
# Hosts whose data path sits on a btrfs data volume back up a read-only snapshot of that volume.
packages_kopia_snapshot_root: >-
  {{
    nodes[target_host]['system']['disk']['data']['fs']['mount_point']
    if (
      (nodes[target_host]['system']['disk']['data']['fs']['type'] | default('')) == 'btrfs'
      and (nodes[target_host]['system']['disk']['data']['fs']['mount_point'] | default('') | length) > 0
      and (nodes[target_host]['paths']['workspace'] | default('') | length) == 0
    )
    else ''
  }}
packages_kopia_snapshot_path: "{{ packages_kopia_snapshot_root ~ '/.kopia-snapshot' }}"
