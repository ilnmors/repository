---
# --- services.yaml ---
services:
  packages:
    git:
      units:
        main:
          release: "git"
          hosts: ["console"]
    build-essential:
      units:
        main:
          release: "build-essential"
          hosts: ["console"]
    fuse3:
      units:
        main:
          release: "fuse3"
          hosts: ["console"]
    acl:
      units:
        main:
          release: "acl"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    jq:
      units:
        main:
          release: "jq"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    curl:
      units:
        main:
          release: "curl"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    sops:
      units:
        main:
          release: "sops"
          hosts: ["console"]
    step:
      units:
        main:
          release: "step"
          hosts: ["console"]
    code-server:
      units:
        main:
          release: "code-server"
          hosts: ["console"]
          domain:
            internal: "code"
          dependency:
            web:
              status: true
            pki:
              cert: true
          ports:
            http:
              protocol: "tcp"
              int: 8081
    nftables:
      units:
        main:
          release: "nftables"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    netcat:
      units:
        main:
          release: "netcat"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    rsync:
      units:
        main:
          release: "rsync"
          hosts: ["console", "vmm", "app"]
    logrotate:
      units:
        main:
          release: "logrotate"
          hosts: ["vmm", "infra"]
    conntrack:
      units:
        main:
          release: "conntrack"
          hosts: ["vmm"]
    resolved:
      units:
        main:
          release: "resolved"
          hosts: ["vmm", "infra", "auth", "app"]
    chrony:
      units:
        main:
          release: "chrony"
          hosts: ["vmm"]
          domain:
            internal: "ntp"
          ports:
            ntp:
              protocol: "udp"
              ext: 123
    wireguard:
      units:
        main:
          release: "wireguard"
          hosts: ["vmm"]
          domain:
            public: "vpn"
          ports:
            wg:
              protocol: "udp"
              ext: 11290
    crowdsec:
      units:
        lapi:
          release: "crowdsec"
          hosts: ["vmm"]
          domain:
            internal: "crowdsec"
          ports:
            https:
              protocol: "tcp"
              ext: 8080
            metrics:
              protocol: "tcp"
              ext: 6060
          dependency:
            pki:
              cert: true
        machine:
          release: "crowdsec"
          hosts: ["vmm", "infra", "auth", "app"]
        fw-bouncer:
          release: "crowdsec-fw-bouncer"
          hosts: ["vmm"]
          acquisd:
            collection:
              - "crowdsecurity/suricata"
            parser: []
            config:
              - "suricata.yaml"
        http-bouncer:
          release: "crowdsec"
          hosts: "{{ services['containers']['caddy']['units']['main']['build']['http-bouncer']['hosts'] }}"
          acquisd:
            collection:
              - "crowdsecurity/caddy"
            parser: []
            config:
              - "caddy.yaml"
        dovecot:
          release: "crowdsec"
          hosts: "{{ services['containers']['dovecot']['units']['main']['hosts'] }}"
          acquisd:
            collection:
              - "crowdsecurity/dovecot"
            parser: []
            config:
              - "dovecot.yaml"
        postfix:
          release: "crowdsec"
          hosts: "{{ services['containers']['postfix']['units']['main']['hosts'] }}"
          acquisd:
            collection:
              - "crowdsecurity/postfix"
            parser: []
            config:
              - "postfix.yaml"
    suricata:
      units:
        main:
          release: "suricata"
          hosts: ["vmm"]
        update:
          release: "suricata-update"
          hosts: ["vmm"]
    bind:
      units:
        main:
          release: "bind"
          hosts: ["vmm"]
          blocklist:
            zone: "blocklist.rpz"
            urls:
              # General
              - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
              - "https://big.oisd.nl"
              - "https://o0.pages.dev/Lite/domains.txt"
              # Korean regional
              - "https://raw.githubusercontent.com/yous/YousList/master/hosts.txt"
              # Telemetry
              - "https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt"
              - "https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt"
          domain:
            internal: "bind"
          ports:
            dns:
              protocol: "udp/tcp"
              ext: 53
    kea4:
      units:
        main:
          release: "kea4"
          hosts: ["vmm"]
          ports:
            dhcp-sv:
              protocol: "udp"
              ext: 67
    ddns:
      units:
        main:
          release: "local"
          hosts: ["vmm"]
    smart-exporter:
      units:
        main:
          release: "smart-exporter"
          hosts: ["vmm"]
    rclone:
      units:
        main:
          release: "rclone"
          hosts: ["vmm"]
    kopia:
      units:
        server:
          release: "kopia"
          hosts: ["vmm"]
          domain:
            internal: "kopia"
          ports:
            http:
              protocol: "tcp"
              int: 51515
          dependency:
            pki:
              cert: true
        client:
          release: "kopia"
          hosts: ["console", "infra", "auth", "app"]
    podman:
      units:
        main:
          release: "podman"
          hosts: ["console", "infra", "auth", "app"]
    ksm:
      units:
        tuned:
          release: "ksm"
          hosts: ["vmm"]
        static:
          release: "ksm"
          hosts: ["app"]
    alloy:
      units:
        main:
          release: "alloy"
          hosts: ["vmm", "infra", "auth", "app"]
  containers:
    caddy:
      units:
        main:
          release: "caddy"
          hosts: ["console", "infra", "auth", "app"]
          ports:
            http:
              protocol: "tcp"
              ext: 80
              int: 2080
              container: 80
            https:
              protocol: "tcp"
              ext: 443
              int: 2443
              container: 443
          build:
            rfc2136:
              release: "rfc2136"
              hosts: ["infra", "auth", "app"]
            http-bouncer:
              release: "http-bouncer"
              hosts: ["auth"]
            crowdsec-bouncer:
              release: "crowdsec-bouncer"
              hosts: ["auth"]
    step-ca:
      units:
        main:
          release: "step-ca"
          hosts: ["infra"]
          domain:
            internal: "step-ca"
          subuid: 100999
          ports:
            https:
              protocol: "tcp"
              ext: 9000
              int: 9000
              container: 9000
    rustfs:
      units:
        main:
          release: "rustfs"
          hosts: ["infra"]
          domain:
            public: "rustfs"
            internal: "rustfs"
          subuid: 110000
          ports:
            http:
              protocol: "tcp"
              int: 9001
              container: 9001
          dependency:
            web:
              status: true
    postgresql:
      units:
        main:
          release: "postgresql"
          hosts: ["infra"]
          domain:
            internal: "postgresql"
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 5432
              container: 5432
          dependency:
            pki:
              cert: true
    mariadb:
      units:
        main:
          release: "mariadb"
          hosts: ["infra"]
          domain:
            internal: "mariadb"
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 3306
              container: 3306
          dependency:
            pki:
              cert: true
    ldap:
      units:
        main:
          release: "ldap"
          hosts: ["infra"]
          domain:
            internal: "ldap"
          subuid: 100999
          ports:
            http:
              protocol: "tcp"
              int: 17170
              container: 17170
            ldaps:
              protocol: "tcp"
              ext: 636
              int: 6360
              container: 6360
          dependency:
            pki:
              cert: true
            web:
              status: true
            db:
              status: true
              type: "postgresql"
    prometheus:
      units:
        main:
          release: "prometheus"
          hosts: ["infra"]
          domain:
            internal: "prometheus"
          subuid: 165533
          ports:
            https:
              protocol: "tcp"
              int: 9090
              container: 9090
          dependency:
            pki:
              cert: true
            web:
              status: true
    loki:
      units:
        main:
          release: "loki"
          hosts: ["infra"]
          domain:
            internal: "loki"
          subuid: 110000
          ports:
            https:
              protocol: "tcp"
              int: 3100
              container: 3100
          dependency:
            pki:
              cert: true
            web:
              status: true
    grafana:
      units:
        main:
          release: "grafana"
          hosts: ["infra"]
          domain:
            internal: "grafana"
          subuid: 100471
          ports:
            http:
              protocol: "tcp"
              int: 3000
              container: 3000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
    x509-exporter:
      units:
        main:
          release: "x509-exporter"
          hosts: ["infra"]
          subuid: 165533
          ports:
            http:
              protocol: "tcp"
              int: 9793
              container: 9793
    dovecot:
      units:
        main:
          release: "dovecot"
          hosts: ["infra"]
          domain:
            internal: "imap"
          # vmail (uid 1000) in the rootless official image.
          subuid: 100999
          ports:
            imaps:
              protocol: "tcp"
              ext: 993
              int: 2993
              container: 31993
          mail:
            # LLDAP groups allowed to log in over IMAP.
            groups: ["admins", "users"]
          dependency:
            pki:
              cert: true
    postfix:
      units:
        main:
          release: "postfix"
          hosts: ["infra"]
          domain:
            internal: "smtp"
          ports:
            submission:
              protocol: "tcp"
              ext: 587
              int: 2587
              container: 587
          mail:
            domains: ["{{ site['domain']['internal'] }}"]
            # LLDAP groups allowed to authenticate for submission (services: notification senders).
            groups: ["admins", "users", "services"]
            # LLDAP uid that receives postmaster@<domain> (RFC 5321) and the postfix notices.
            postmaster: "il"
            relay:
              # Outbound smarthost (e.g. Gmail / a relay provider). Credentials: secrets['postfix']['relay'].
              status: false
              host: ""
              port: 587
          dependency:
            pki:
              cert: true
    authelia:
      units:
        main:
          release: "authelia"
          hosts: ["auth"]
          domain:
            public: "authelia"
          ports:
            http:
              protocol: "tcp"
              int: 9091
              container: 9091
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
    linkding:
      units:
        main:
          release: "linkding"
          hosts: ["app"]
          domain:
            public: "linkding"
            internal: "linkding.app"
          subuid: 100032
          ports:
            http:
              protocol: "tcp"
              int: 9090
              container: 9090
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            oidc:
              status: true
              redirect_uris: ["/oidc/callback/"]
              scopes: ["openid", "email", "profile"]
              auth_method: "client_secret_post"
    vaultwarden:
      units:
        main:
          release: "vaultwarden"
          hosts: ["app"]
          domain:
            public: "vaultwarden"
            internal: "vaultwarden.app"
          ports:
            http:
              protocol: "tcp"
              int: 8000
              container: 80
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
    forgejo:
      units:
        main:
          release: "forgejo"
          hosts: ["app"]
          domain:
            public: "forgejo"
            internal: "forgejo.app"
          subuid: 100999
          ports:
            http:
              protocol: "tcp"
              int: 3001
              container: 3000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            oidc:
              status: true
              redirect_uris: ["/user/oauth2/authelia/callback"]
              scopes: ["openid", "email", "profile"]
              auth_method: "client_secret_basic"
    oxicloud:
      units:
        main:
          release: "oxicloud"
          hosts: ["app"]
          domain:
            public: "oxicloud"
            internal: "oxicloud.app"
          # oxicloud (uid 1001) in the official image.
          subuid: 101000
          ports:
            http:
              protocol: "tcp"
              int: 8007
              container: 8086
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
              extensions: ["pg_trgm", "ltree"]
            oidc:
              status: true
              redirect_uris: ["/api/auth/oidc/callback"]
              scopes: ["openid", "profile", "email", "groups"]
              auth_method: "client_secret_post"
              pkce: true
            # Collabora accepts WOPI requests from this unit's public domain.
            wopi:
              status: true
    collabora:
      units:
        main:
          release: "collabora"
          hosts: ["app"]
          domain:
            public: "collabora"
            internal: "collabora.app"
          subuid: 101000
          ports:
            http:
              protocol: "tcp"
              int: 9980
              container: 9980
          dependency:
            web:
              status: true
    snappymail:
      units:
        main:
          release: "snappymail"
          hosts: ["app"]
          domain:
            public: "snappymail"
            internal: "snappymail.app"
          subuid: 100081
          ports:
            http:
              protocol: "tcp"
              int: 8888
              container: 8888
          dependency:
            web:
              status: true
    mastodon:
      units:
        main:
          release: "mastodon"
          hosts: ["app"]
          domain:
            public: "mastodon"
            internal: "mastodon.app"
          subuid: 100990
          ports:
            http:
              protocol: "tcp"
              int: 3002
              container: 3000
            api:
              protocol: "tcp"
              int: 4000
              container: 4000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            s3:
              status: true
              buckets:
                - name: "mastodon"
                  public_read: true
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
            oidc:
              status: true
              redirect_uris: ["/auth/auth/openid_connect/callback"]
              scopes: ["openid", "groups", "email", "profile"]
              auth_method: "client_secret_basic"
              pkce: true
          route:
            api: "/api/v1/streaming*"
        streaming:
          release: "mastodon-streaming"
          hosts: ["app"]
          subuid: 100990
        worker:
          release: "mastodon"
          hosts: ["app"]
          subuid: 100990
        valkey:
          release: "valkey"
          hosts: ["app"]
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 6379
              container: 6379
    kaneo:
      units:
        main:
          release: "kaneo"
          hosts: ["app"]
          domain:
            public: "kaneo"
            internal: "kaneo.app"
          subuid: 101000
          ports:
            http:
              protocol: "tcp"
              int: 8006
              container: 5173
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            oidc:
              status: true
              redirect_uris: ["/api/auth/oauth2/callback/custom"]
              scopes: ["openid", "profile", "email"]
              auth_method: "client_secret_post"
              pkce: true
            s3:
              status: true
              buckets:
                - name: "kaneo"
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
    immich:
      units:
        main:
          release: "immich"
          hosts: ["app"]
          domain:
            public: "immich"
            internal: "immich.app"
          ports:
            http:
              protocol: "tcp"
              int: 2283
              container: 2283
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
              extensions: ["vchord", "earthdistance"]
            oidc:
              status: true
              redirect_uris: ["/auth/login", "/user-settings", "app.immich:///oauth-callback"]
              scopes: ["openid", "profile", "email"]
              auth_method: "client_secret_post"
        ml:
          release: "immich-ml"
          hosts: ["app"]
          ports:
            http:
              protocol: "tcp"
              int: 3003
              container: 3003
        valkey:
          release: "valkey"
          hosts: ["app"]
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 6381
              container: 6379
    outline:
      units:
        main:
          release: "outline"
          hosts: ["app"]
          domain:
            public: "outline"
            internal: "outline.app"
          subuid: 101000
          ports:
            http:
              protocol: "tcp"
              int: 3004
              container: 3000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            s3:
              status: true
              buckets:
                - name: "outline"
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
            oidc:
              status: true
              redirect_uris: ["/auth/oidc.callback"]
              scopes: ["openid", "offline_access", "profile", "email"]
              auth_method: "client_secret_post"
        valkey:
          release: "valkey"
          hosts: ["app"]
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 6382
              container: 6379
    bookstack:
      units:
        main:
          release: "bookstack"
          hosts: ["app"]
          domain:
            public: "bookstack"
            internal: "bookstack.app"
          subuid: 100032
          ports:
            http:
              protocol: "tcp"
              int: 8004
              container: 8080
          dependency:
            web:
              status: true
            db:
              status: true
              type: "mariadb"
            s3:
              status: true
              buckets:
                - name: "bookstack"
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
            oidc:
              status: true
              redirect_uris: ["/oidc/callback"]
              scopes: ["openid", "profile", "email", "groups"]
              auth_method: "client_secret_basic"
              pkce: true
    quartermaster:
      units:
        main:
          release: "quartermaster"
          hosts: ["app"]
          # Internal only: the dashboard runs with -admin-open, so it gets no public route.
          domain:
            internal: "quartermaster.app"
          ports:
            http:
              protocol: "tcp"
              int: 10000
              container: 8080
          dependency:
            web:
              status: true
          # Models, backends and routing groups: templates/quartermaster/config/config.yaml.j2.
    openwebui:
      units:
        main:
          release: "openwebui"
          hosts: ["app"]
          domain:
            public: "openwebui"
            internal: "openwebui.app"
          ports:
            http:
              protocol: "tcp"
              int: 8002
              container: 8080
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
              extensions: ["vector"]
            s3:
              status: true
              access_key: "open-webui"
              buckets:
                - name: "open-webui"
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
            oidc:
              status: true
              redirect_uris: ["/oauth/oidc/callback"]
              scopes: ["openid", "profile", "groups", "email"]
              auth_method: "client_secret_basic"
              pkce: true
          # Quartermaster model ids. Empty values disable RAG embedding and image generation.
          ai:
            embedding_model: "LFM2.5-Embedding-350M"
            image_model: "zImage-moodyRealMix"
    sure:
      units:
        main:
          release: "sure"
          hosts: ["app"]
          domain:
            public: "sure"
            internal: "sure.app"
          subuid: 100999
          ports:
            http:
              protocol: "tcp"
              int: 3006
              container: 3000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            s3:
              status: true
              buckets:
                - name: "sure"
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
            oidc:
              status: true
              redirect_uris: ["/auth/openid_connect/callback"]
              scopes: ["openid", "email", "profile", "groups"]
              auth_method: "client_secret_basic"
              pkce: true
        worker:
          release: "sure"
          hosts: ["app"]
          subuid: 100999
        valkey:
          release: "valkey"
          hosts: ["app"]
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 6383
              container: 6379
    readur:
      units:
        main:
          release: "readur"
          hosts: ["app"]
          domain:
            public: "readur"
            internal: "readur.app"
          ports:
            http:
              protocol: "tcp"
              int: 8011
              container: 8000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
            s3:
              status: true
              buckets:
                - name: "readur"
                  actions:
                    bucket: ["ListBucket", "GetBucketLocation"]
                    object: ["GetObject", "PutObject", "DeleteObject", "AbortMultipartUpload", "ListMultipartUploadParts"]
            oidc:
              status: true
              redirect_uris: ["/api/auth/oidc/callback"]
              scopes: ["openid", "profile", "email"]
              auth_method: "client_secret_basic"
              pkce: true
    homepage:
      units:
        main:
          release: "homepage"
          hosts: ["app"]
          domain:
            public: "@"
            internal: "homepage.app"
          ports:
            http:
              protocol: "tcp"
              int: 3000
              container: 3000
          dependency:
            web:
              status: true
