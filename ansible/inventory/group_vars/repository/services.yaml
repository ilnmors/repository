---
# --- services.yaml ---
services:
  packages:
    git:
      units:
        main:
          release: "git"
          hosts: ["console"]
    build-essential:
      units:
        main:
          release: "build-essential"
          hosts: ["console"]
    fuse3:
      units:
        main:
          release: "fuse3"
          hosts: ["console"]
    acl:
      units:
        main:
          release: "acl"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    jq:
      units:
        main:
          release: "jq"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    curl:
      units:
        main:
          release: "curl"
          hosts: ["console", "vmm", "infra", "auth", "app"]
    sops:
      units:
        main:
          release: "sops"
          hosts: ["console"]
    step:
      units:
        main:
          release: "step"
          hosts: ["console"]
    code-server:
      units:
        main:
          release: "code-server"
          hosts: ["console"]
          ports:
            http:
              protocol: "tcp"
              int: 8081
    nftables:
      units:
        main:
          release: "nftables"
          hosts: ["vmm", "infra", "auth", "app"]
    netcat:
      units:
        main:
          release: "netcat"
          hosts: ["vmm", "infra", "auth", "app"]
    rsync:
      units:
        main:
          release: "rsync"
          hosts: ["console", "vmm", "app"]
    logrotate:
      units:
        main:
          release: "logrotate"
          hosts: ["vmm"]
    conntrack:
      units:
        main:
          release: "conntrack"
          hosts: ["vmm"]
    resolved:
      units:
        main:
          release: "resolved"
          hosts: ["vmm", "infra", "auth", "app"]
    chrony:
      units:
        main:
          release: "chrony"
          hosts: ["vmm"]
          domain:
            internal: "ntp"
          ports:
            ntp:
              protocol: "udp"
              ext: 123
    wireguard:
      units:
        main:
          release: "wireguard"
          hosts: ["vmm"]
          domain:
            public: "vpn"
          ports:
            wg:
              protocol: "udp"
              ext: 11290
    crowdsec:
      units:
        lapi:
          release: "crowdsec"
          hosts: ["vmm"]
          domain:
            internal: "crowdsec"
          ports:
            https:
              protocol: "tcp"
              ext: 8080
            metrics:
              protocol: "tcp"
              ext: 6060
          dependency:
            pki:
              cert: true
        machine:
          release: "crowdsec"
          hosts: ["vmm", "infra", "auth", "app"]
        fw-bouncer:
          release: "crowdsec-fw-bouncer"
          hosts: ["vmm"]
          acquisd:
            collection:
              - "crowdsecurity/suricata"
            parser: []
            config:
              - "suricata.yaml"
        http-bouncer:
          release: "crowdsec"
          hosts: "{{ services['containers']['caddy']['units']['main']['build']['http-bouncer']['hosts'] }}"
          acquisd:
            collection:
              - "crowdsecurity/caddy"
            parser:
              - "crowdsecurity/nextcloud-whitelist"
            config:
              - "caddy.yaml"
        dovecot:
          release: "crowdsec"
          hosts: "{{ services['containers']['dovecot']['units']['main']['hosts'] }}"
          acquisd:
            collection:
              - "crowdsecurity/dovecot"
            parser: []
            config:
              - "dovecot.yaml"
        postfix:
          release: "crowdsec"
          hosts: "{{ services['containers']['postfix']['units']['main']['hosts'] }}"
          acquisd:
            collection:
              - "crowdsecurity/postfix"
            parser: []
            config:
              - "postfix.yaml"
    suricata:
      units:
        main:
          release: "suricata"
          hosts: ["vmm"]
        update:
          release: "suricata-update"
          hosts: ["vmm"]
    bind:
      units:
        main:
          release: "bind"
          hosts: ["vmm"]
          domain:
            internal: "bind"
          ports:
            dns:
              protocol: "udp/tcp"
              ext: 53
    kea4:
      units:
        main:
          release: "kea4"
          hosts: ["vmm"]
          ports:
            dhcp-sv:
              protocol: "udp"
              ext: 67
    ddns:
      units:
        main:
          release: "local"
          hosts: ["vmm"]
    smart-exporter:
      units:
        main:
          release: "smart-exporter"
          hosts: ["vmm"]
    rclone:
      units:
        main:
          release: "rclone"
          hosts: ["vmm"]
    kopia:
      units:
        server:
          release: "kopia"
          hosts: ["vmm"]
          domain:
            internal: "kopia"
          ports:
            http:
              protocol: "tcp"
              int: 51515
          dependency:
            pki:
              cert: true
        client:
          release: "kopia"
          hosts: ["infra", "auth", "app"]
    podman:
      units:
        main:
          release: "podman"
          hosts: ["infra", "auth", "app"]
    ksm:
      units:
        tuned:
          release: "ksm"
          hosts: ["vmm"]
        static:
          release: "ksm"
          hosts: ["app"]
    alloy:
      units:
        main:
          release: "alloy"
          hosts: ["vmm", "infra", "auth", "app"]
  containers:
    caddy:
      units:
        main:
          release: "caddy"
          hosts: ["infra", "auth", "app"]
          ports:
            http:
              protocol: "tcp"
              ext: 80
              int: 2080
              container: 80
            https:
              protocol: "tcp"
              ext: 443
              int: 2443
              container: 443
          build:
            rfc2136:
              release: "rfc2136"
              hosts: ["infra", "auth", "app"]
            http-bouncer:
              release: "http-bouncer"
              hosts: ["auth"]
            crowdsec-bouncer:
              release: "crowdsec-bouncer"
              hosts: ["auth"]
    step-ca:
      units:
        main:
          release: "step-ca"
          hosts: ["infra"]
          domain:
            internal: "step-ca"
          subuid: 100999
          ports:
            https:
              protocol: "tcp"
              ext: 9000
              int: 9000
              container: 9000
    rustfs:
      units:
        main:
          release: "rustfs"
          hosts: ["infra"]
          domain:
            internal: "rustfs"
          subuid: 110000
          ports:
            http:
              protocol: "tcp"
              int: 9001
              container: 9001
          dependency:
            web:
              status: true
    postgresql:
      units:
        main:
          release: "postgresql"
          hosts: ["infra"]
          domain:
            internal: "postgresql"
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 5432
              container: 5432
          dependency:
            pki:
              cert: true
    mariadb:
      units:
        main:
          release: "mariadb"
          hosts: ["infra"]
          domain:
            internal: "mariadb"
          subuid: 100998
          ports:
            tcp:
              protocol: "tcp"
              int: 3306
              container: 3306
          dependency:
            pki:
              cert: true
    ldap:
      units:
        main:
          release: "ldap"
          hosts: ["infra"]
          domain:
            internal: "ldap"
          subuid: 100999
          ports:
            http:
              protocol: "tcp"
              int: 17170
              container: 17170
            ldaps:
              protocol: "tcp"
              ext: 636
              int: 6360
              container: 6360
          dependency:
            pki:
              cert: true
            web:
              status: true
            db:
              status: true
              type: "postgresql"
    prometheus:
      units:
        main:
          release: "prometheus"
          hosts: ["infra"]
          domain:
            internal: "prometheus"
          subuid: 165533
          ports:
            https:
              protocol: "tcp"
              int: 9090
              container: 9090
          dependency:
            pki:
              cert: true
            web:
              status: true
    loki:
      units:
        main:
          release: "loki"
          hosts: ["infra"]
          domain:
            internal: "loki"
          subuid: 110000
          ports:
            https:
              protocol: "tcp"
              int: 3100
              container: 3100
          dependency:
            pki:
              cert: true
            web:
              status: true
    grafana:
      units:
        main:
          release: "grafana"
          hosts: ["infra"]
          domain:
            internal: "grafana"
          subuid: 100471
          ports:
            http:
              protocol: "tcp"
              int: 3000
              container: 3000
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
    x509-exporter:
      units:
        main:
          release: "x509-exporter"
          hosts: ["infra"]
          subuid: 165533
          ports:
            http:
              protocol: "tcp"
              int: 9793
              container: 9793
    dovecot:
      units:
        main:
          release: "dovecot"
          hosts: ["infra"]
          domain:
            internal: "imap"
          # vmail (uid 1000) in the rootless official image.
          subuid: 100999
          ports:
            imaps:
              protocol: "tcp"
              ext: 993
              int: 2993
              container: 31993
          mail:
            # LLDAP groups allowed to log in over IMAP.
            groups: ["admins", "users"]
          dependency:
            pki:
              cert: true
    postfix:
      units:
        main:
          release: "postfix"
          hosts: ["infra"]
          domain:
            internal: "smtp"
          ports:
            submission:
              protocol: "tcp"
              ext: 587
              int: 2587
              container: 587
          mail:
            domains: ["{{ site['domain']['internal'] }}"]
            # LLDAP groups allowed to authenticate for submission (services: notification senders).
            groups: ["admins", "users", "services"]
            # LLDAP uid that receives postmaster@<domain> (RFC 5321) and the postfix notices.
            postmaster: "il"
            relay:
              # Outbound smarthost (e.g. Gmail / a relay provider). Credentials: secrets['postfix']['relay'].
              status: false
              host: ""
              port: 587
          dependency:
            pki:
              cert: true
    authelia:
      units:
        main:
          release: "authelia"
          hosts: ["auth"]
          domain:
            public: "authelia"
          ports:
            http:
              protocol: "tcp"
              int: 9091
              container: 9091
          dependency:
            web:
              status: true
            db:
              status: true
              type: "postgresql"
