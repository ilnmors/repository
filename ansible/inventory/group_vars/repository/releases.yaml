      repository: "docker.io/rustfs/rustfs"
      tag: "1.0.6"
    postgresql:
      name: "postgresql"
      repository: "docker.io/library/postgres"
      tag: "18.7"
      build:
        status: true
        vectorchord:
          repository: "https://github.com/tensorchord/VectorChord"
          tag: "1.1.1"
    mariadb:
      name: "mariadb"
      repository: "docker.io/library/mariadb"
      tag: "13.0.2"
    ldap:
      name: "ldap"
      repository: "docker.io/lldap/lldap"
      tag: "v0.6.3"
      # Local patch mounted over the image (roles/containers/templates/ldap/style/style.css): the web UI theme. The
      # playbook stops when the image's own copy no longer has the SHA256 the theme was made from (check-patches.yaml).
      patches:
        - path: "/app/app/static/style.css"
          upstream_sha256: "01865c7423d81188b198bb3147343e1ee4c906be23dc57ca8b65d8b0a1962dbf"
    prometheus:
      name: "prometheus"
      repository: "docker.io/prom/prometheus"
      tag: "v3.16.0"
    loki:
      name: "loki"
      repository: "docker.io/grafana/loki"
      tag: "3.7.10"
    grafana:
      name: "grafana"
      repository: "docker.io/grafana/grafana"
      tag: "13.3.2"
    x509-exporter:
      name: "x509-exporter"
      repository: "docker.io/enix/x509-certificate-exporter"
      tag: "4.2.4"
    dovecot:
      name: "dovecot"
      repository: "docker.io/dovecot/dovecot"
      tag: "2.4.5"
    postfix:
      name: "postfix"
      # Built on the Debian base image; the tag follows the postfix version, so bumping it rebuilds the image.
      repository: "docker.io/library/debian"
      tag: "3.10.13"
      build:
        status: true
        base:
          tag: "13-slim"
        package:
          version: "3.10.13-0+deb13u1"
    authelia:
      name: "authelia"
      repository: "docker.io/authelia/authelia"
      tag: "4.39.28"
    valkey:
      name: "valkey"
      repository: "docker.io/valkey/valkey"
      tag: "9.2.0"
    linkding:
      name: "linkding"
      repository: "ghcr.io/sissbruecker/linkding"
      tag: "1.47.0"
    vaultwarden:
      name: "vaultwarden"
      repository: "docker.io/vaultwarden/server"
      tag: "1.37.5"
    forgejo:
      name: "forgejo"
      repository: "codeberg.org/forgejo/forgejo"
      tag: "17.0.2"
    oxicloud:
      name: "oxicloud"
      repository: "docker.io/diocrafts/oxicloud"
      tag: "0.10.1"
    collabora:
      name: "collabora"
      repository: "docker.io/collabora/code"
      tag: "26.04.6.2.1"
    snappymail:
      name: "snappymail"
      repository: "ghcr.io/the-djmaze/snappymail"
      tag: "v3.1.4-1"
    mastodon:
      name: "mastodon"
      repository: "ghcr.io/mastodon/mastodon"
      tag: "v4.7.6"
      # Local patches mounted over the image (roles/containers/templates/mastodon/patches/<file name>): animated WebP stays animated
      # WebP, GIF uploads become WebP instead of an MP4 gifv, uploads may be larger (50 MB images, 1 GB videos), and
      # videos uploaded through v1 are processed in the background, the post being removed if that processing fails.
      # The playbook stops when the image's own copy no longer has the SHA256 a patch was made from, so a new tag
      # forces a review.
      patches:
        - path: "/opt/mastodon/lib/paperclip/vips_lazy_thumbnail.rb"
          upstream_sha256: "de7655d90db41a5da3a49c81e46c44eead1da5bf8c02c90ac69bd32ca8e88e96"
        - path: "/opt/mastodon/app/models/media_attachment.rb"
          upstream_sha256: "b300e5222b088a890a52330ae84745c0b534820262de3bc1578ccc3bc1ae9219"
        - path: "/opt/mastodon/app/controllers/api/v1/media_controller.rb"
          upstream_sha256: "7ffd756cab006af2be85bd71b062ba47cbd843fc4f039fbfbd6a91dc9eaed213"
        - path: "/opt/mastodon/app/services/post_status_service.rb"
          upstream_sha256: "1e709114350d998dd93ce7d606eab4d6d4ffca3ea120bdf6913c29afef6b5dce"
        - path: "/opt/mastodon/app/workers/post_process_media_worker.rb"
          upstream_sha256: "a605d5c1ad866513fbcd67e5c67bf3d7731d18907c637746adea3d4d80f011a2"
    mastodon-streaming:
      name: "mastodon-streaming"
      repository: "ghcr.io/mastodon/mastodon-streaming"
      tag: "{{ releases['containers']['mastodon']['tag'] }}"
    kaneo:
      name: "kaneo"
      repository: "ghcr.io/usekaneo/kaneo"
      tag: "2.50.0"
    immich:
      name: "immich"
      repository: "ghcr.io/immich-app/immich-server"
      tag: "v3.4.2"
    immich-ml:
      name: "immich-ml"
      repository: "ghcr.io/immich-app/immich-machine-learning"
      tag: "{{ releases['containers']['immich']['tag'] }}-openvino"
    outline:
      name: "outline"
      repository: "docker.io/outlinewiki/outline"
      tag: "1.13.0"
    bookstack:
      name: "bookstack"
      repository: "docker.io/solidnerd/bookstack"
      tag: "26.9.3"
    quartermaster:
      name: "quartermaster"
      repository: "ghcr.io/quartermaster-labs/quartermaster"
      tag: "v1.10.1"
      # Rebuilt on a newer Ubuntu with the Mesa Vulkan drivers (upstream ships the loader only). Both backends come
      # from their own releases instead of the copies bundled upstream, so they follow llama.cpp and sd.cpp directly.
      build:
        status: true
        base:
          tag: "26.04"
        llama_server:
          tag: "b12721"
        sd_server:
          tag: "master-1127-79dc7ca"
        # Strata serves Qwen3.8-Flash-Next with the experts streamed from RAM; its self-contained engine (HIP, bundled
        # ROCm libraries) and launcher are copied from the release image, built for the RX 7900 XT (gfx110x).
        strata:
          repository: "ghcr.io/niko1221/strata"
          tag: "0.2.21-rocm-gfx110x"
          # Local patch applied while the image is built (templates/quartermaster/build/Containerfile.j2), not mounted:
          # sed makes the launcher serve on loopback (--access local) and keep its state in /data/strata. The build
          # checks the result with grep and stops when the text it replaces is gone, so no upstream_sha256 here.
          patches:
            - path: "/opt/strata/entrypoint.sh"
    searxng:
      name: "searxng"
      repository: "docker.io/searxng/searxng"
      tag: "2026.11.23-a7163d091"
    mcp:
      name: "mcp"
      repository: "docker.io/library/python"
      tag: "0.2.3"
      build:
        status: true
        base:
          tag: "3.13-slim"
        source:
          repository: "https://github.com/ilnmors/mcp"
          tag: "v0.2.3"
    openwebui:
      name: "openwebui"
      repository: "ghcr.io/open-webui/open-webui"
      tag: "v0.13.5"
      # Local patch mounted over the image (roles/containers/templates/openwebui/library/loader.js): the empty hook every
      # page loads gets the Library row of the user menu. The playbook stops when the image's copy is no longer the
      # empty file (check-patches.yaml).
      patches:
        - path: "/app/build/static/loader.js"
          upstream_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    sure:
      name: "sure"
      repository: "ghcr.io/we-promise/sure"
      tag: "0.7.6-hotfix.2"
    readur:
      name: "readur"
      repository: "ghcr.io/readur/readur"
      tag: "3.1.4"
    tandoor:
      name: "tandoor"
      repository: "docker.io/vabene1111/recipes"
      tag: "2.7.8"
    homepage:
      name: "homepage"
      repository: "docker.io/gethomepage/homepage"
      tag: "v2.8.0"
