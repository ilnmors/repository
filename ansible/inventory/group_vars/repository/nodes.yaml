---
# --- nodes.yaml ---
group:
  name: "svadmins"
  gid: 2000

nodes:
  console:
    control_node: true
    virtualization: false
    user: "console"
    uid: 3000
    group: "{{ group['name'] }}"
    paths:
      home: "/home/console"
  vmm:
    control_node: false
    virtualization: false
    user: "vmm"
    uid: 2000
    group: "{{ group['name'] }}"
    paths:
      home: "/home/vmm"
      libvirt: "/var/lib/libvirt"
    system:
      disk:
        root:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'root')
              | map(attribute='value.serial')
              | list
            }}
          size: "128G"
          fs:
            type: "ext4"
            label: null
            mount_point: "/"
            mount_opts: []
        data:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'data')
              | map(attribute='value.serial')
              | list
            }}
          fs:
            type: "btrfs"
            label: "{{ site['org'] }}_data"
            mount_point: "{{ nodes['vmm']['paths']['libvirt'] }}/disk/data"
            mount_opts: ["defaults", "noatime", "nodatacow", "degraded", "nofail"]
            btrfs:
              profile: "raid1"
              metadata: "raid1"
              min_devices: 2
        backup:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'backup')
              | map(attribute='value.serial')
              | list
            }}
          fs:
            type: "btrfs"
            label: "{{ site['org'] }}_backup"
            mount_point: "{{ nodes['vmm']['paths']['libvirt'] }}/disk/backup"
            mount_opts: ["defaults", "noatime", "nodatacow", "nofail"]
            btrfs:
              profile: "single"
              metadata: "dup"
              min_devices: 1
      nic:
        eth0:
          mac: "{{ hardwares['vmm']['nic']['nic01']['mac'] }}"
          vlan: null
        eth1:
          mac: "{{ hardwares['vmm']['nic']['nic02']['mac'] }}"
          vlan: [1, 10, 20]
  client:
    control_node: true
    virtualization: true
    user: "client"
    uid: 3001
    group: "{{ group['name'] }}"
    paths:
      home: "/home/client"
      data: "/data/client"
    system:
      cpu:
        vcpu: 8
        pin: []
        emulator: []
        shares: 1024
      memory: "16G"
      gpu:
        type: "vfio"
        address: >-
          {{
            hardwares['vmm']['gpu']
            | dict2items
            | selectattr('value.type', 'defined')
            | selectattr('value.type', 'equalto', 'igpu')
            | map(attribute='value.address')
            | list
          }}
      usb:
        type: "vfio"
        address: >-
          {{
            hardwares['vmm']['usb']
            | dict2items
            | selectattr('value.type', 'defined')
            | selectattr('value.type', 'equalto', 'xhci')
            | map(attribute='value.address')
            | list
          }}
      disk:
        root:
          size: "512G"
        data:
          type: "block"
          format: "raw"
          path: "{{ nodes['vmm']['system']['disk']['backup']['fs']['mount_point'] }}"
          pool: "backup-pool"
          size: "1.75T"
          mount_point: "/data"
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan1-access"
          mac: "0a:49:6e:4d:00:00"
  infra:
    control_node: false
    virtualization: true
    user: "infra"
    uid: 2001
    group: "{{ group['name'] }}"
    paths:
      home: "/home/infra"
      data: "/data/infra"
    system:
      cpu:
        vcpu: 6
        pin: []
        emulator: []
        shares: 2048
      memory: "6G"
      disk:
        root:
          size: "256G"
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan10-access"
          mac: "0a:49:6e:4d:01:00"
  auth:
    control_node: false
    virtualization: true
    user: "auth"
    uid: 2002
    group: "{{ group['name'] }}"
    paths:
      home: "/home/auth"
      data: "/data/auth"
    system:
      cpu:
        vcpu: 2
        pin: []
        emulator: []
        shares: 1024
      memory: "1G"
      disk:
        root:
          size: "32G"
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan10-access"
          mac: "0a:49:6e:4d:02:00"
  app:
    control_node: false
    virtualization: true
    user: "app"
    uid: 2003
    group: "{{ group['name'] }}"
    paths:
      home: "/home/app"
      data: "/data/app"
    system:
      cpu:
        vcpu: 12
        pin: []
        emulator: []
        shares: 1024
      memory: "38G"
      gpu:
        type: "vfio"
        address: >-
          {{
            hardwares['vmm']['gpu']
            | dict2items
            | selectattr('value.type', 'defined')
            | selectattr('value.type', 'equalto', 'egpu')
            | map(attribute='value.address')
            | list
          }}
      disk:
        root:
          size: "512G"
        data:
          type: "block"
          format: "raw"
          path: "{{ nodes['vmm']['system']['disk']['data']['fs']['mount_point'] }}"
          pool: "data-pool"
          size: "1.75T"
          mount_point: "/data"
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan10-access"
          mac: "0a:49:6e:4d:03:00"
