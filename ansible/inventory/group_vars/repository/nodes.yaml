---
# --- nodes.yaml ---
group:
  name: "svadmins"
  gid: 2000

nodes:
  console:
    control_node: true
    virtualization: false
    user: "console"
    uid: 3000
    group: "{{ group['name'] }}"
    paths:
      home: "/home/console"
      repository: "/home/console/workspace/repository"
      workspace: "/home/console/workspace"
      data: "/home/console/.local/share/repository"
  vmm:
    control_node: false
    virtualization: false
    user: "vmm"
    uid: 2000
    group: "{{ group['name'] }}"
    paths:
      home: "/home/vmm"
      libvirt: "/var/lib/libvirt"
    system:
      disk:
        root:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'root')
              | map(attribute='value.serial')
              | list
            }}
          size: "128G"
          fs:
            type: "ext4"
            label: null
            mount_point: "/"
            mount_opts: []
        data:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'data')
              | map(attribute='value.serial')
              | list
            }}
          fs:
            type: "btrfs"
            label: "{{ site['org'] }}_data"
            btrfs:
              profile: "raid1"
              metadata: "raid1"
              min_devices: 2
        backup:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'backup')
              | map(attribute='value.serial')
              | list
            }}
          fs:
            type: "btrfs"
            label: "{{ site['org'] }}_backup"
            mount_point: "/backup"
            mount_opts: ["defaults", "noatime", "nofail"]
            btrfs:
              profile: "single"
              metadata: "dup"
              min_devices: 1
        swap:
          serials: >-
            {{ hardwares['vmm']['disk']
              | dict2items
              | selectattr('value.role', 'defined')
              | selectattr('value.role', 'equalto', 'swap')
              | map(attribute='value.serial')
              | list
            }}
          fs:
            type: "swap"
            label: "{{ site['org'] }}_swap"
      nic:
        eth0:
          mac: "{{ hardwares['vmm']['nic']['nic01']['mac'] }}"
          vlan: null
        eth1:
          mac: "{{ hardwares['vmm']['nic']['nic02']['mac'] }}"
          vlan: [1, 10, 20]
  infra:
    control_node: false
    virtualization: true
    user: "infra"
    uid: 2001
    group: "{{ group['name'] }}"
    paths:
      home: "/home/infra"
      data: "/data/infra"
    system:
      cpu:
        vcpu: 6
        pin: []
        emulator: []
        shares: 2048
      memory: "8G"
      disk:
        root:
          size: "512G"
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan{{ networks['segments']['server']['vlan'] }}-access"
          mac: "0a:49:6e:4d:01:00"
  auth:
    control_node: false
    virtualization: true
    user: "auth"
    uid: 2002
    group: "{{ group['name'] }}"
    paths:
      home: "/home/auth"
      data: "/data/auth"
    system:
      cpu:
        vcpu: 2
        pin: []
        emulator: []
        shares: 1024
      memory: "1G"
      disk:
        root:
          size: "64G"
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan{{ networks['segments']['server']['vlan'] }}-access"
          mac: "0a:49:6e:4d:02:00"
  app:
    control_node: false
    virtualization: true
    user: "app"
    uid: 2003
    group: "{{ group['name'] }}"
    paths:
      home: "/home/app"
      data: "/data/app"
    system:
      cpu:
        vcpu: 12
        pin: []
        emulator: []
        shares: 1024
      memory: "48G"
      gpu:
        type: "vfio"
        address: >-
          {{
            hardwares['vmm']['gpu']
            | dict2items
            | selectattr('value.type', 'defined')
            | map(attribute='value.address')
            | list
          }}
        drivers: >-
          {{
            hardwares['vmm']['gpu']
            | dict2items
            | selectattr('value.type', 'defined')
            | map(attribute='value.driver')
            | list
          }}
      disk:
        root:
          size: "1T"
        data:
          type: "block"
          serials: "{{ nodes['vmm']['system']['disk']['data']['serials'] }}"
          fs:
            type: "btrfs"
            label: "{{ nodes['vmm']['system']['disk']['data']['fs']['label'] }}"
            mount_point: "/data"
            mount_opts: ["defaults", "noatime", "degraded", "nofail"]
      nic:
        lan:
          type: "virtio"
          libvirt_network: "lan-net"
          port_group: "vlan{{ networks['segments']['server']['vlan'] }}-access"
          mac: "0a:49:6e:4d:03:00"
